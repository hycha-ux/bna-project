# 자동 검수 항목. 비전 모델에 각 항목을 0~10 으로 채점시키고 threshold 미달 시 재생성.
threshold: 7
hard_fail: [identity]   # 이 항목이 임계 미달이면 다른 점수와 무관하게 불합격

# 항목별 합격선(없으면 위 threshold). ⚠ 컷을 바꾸면 그 전후 회차의 통과율이 다른 자로 잰 값이 된다 —
# 바꿀 땐 날짜·근거를 여기 남기고, 옛 회차와 비교할 땐 `vision.cuts` 를 보고 갈라라.
#
# 2026-09-10 effect_visible 7 → 6 (근거: 사람 검수 27건 실측, 성연서님 판정).
#   ① 점수가 6점에 몰려 있는데(26건 중 10건) 컷이 바로 그 위 7점이었다 → 미달 54%, 나머지 4항목은 미달 0%.
#      즉 이 한 항목이 통과율 전부를 정하고 있었다.
#   ② 사람이 실제로 채택한 비율: 6점 구간 4/10(40%) · 7점 구간 5/8(63%) · 8점 구간 1/4 · **5점 이하 0/4**.
#      6점은 사람이 쓸 만하다고 본 사진이 40% 있는데 기계가 전부 버리고 다시 그렸다.
#      5점 이하는 사람도 한 장도 안 골랐다 → 6 이 사람 눈과 맞는 자리다(5 까지 내리면 안 된다).
#   ⚠ 이 컷이 '좋은 사진 보증'은 아니다 — AI 통과 10건 중 4건을 사람이 되돌려 버렸다(사유 '효과 없음' 3·'손가락' 1).
#      기계 검수는 사람 검수 앞의 거름망이지 대체가 아니다.
thresholds:
  effect_visible: 6
# '이 사진엔 해당 없음'을 0점으로 받으면 안 되는 항목. 심사가 "n/a" 로 답할 수 있고, n/a 는 실패가 아니다.
# 2026-09-09 실사고: 셀카 프롬프트는 "폰이 보이지 않게" 라고 지시하는데 fingers 는 "손가락 다섯 개·자연스러운
# 그립"을 요구했다. 심사가 "Hands or phone not visible in either image" 라고 적고 0점을 줬고, 그 결과
# **모든 셀카가 100% 탈락**했다(3장 3회씩 재시도, $3.49 소각, 통과 0). 나머지 점수는 9·9·10·8 로 멀쩡했다.
na_allowed: []
items:
  # 2026-09-10 성연서님 지시로 **뜻을 뒤집었다**: 종전 `fingers` 는 "손이 잘 그려졌나"를 물어서
  # 손이 나온 컷을 9점으로 통과시켰다(0910 실측 2건). 기준은 "손이 나오면 안 된다"이므로 없을 때 10점이다.
  # ⚠ 키 이름을 바꾼 건 의도다 — 같은 이름으로 뜻만 바꾸면 옛 회차의 `fingers` 점수와 새 점수가
  #   한 열에 섞여 조용히 비교가 무의미해진다(옛 9점 = 손 있음, 새 9점 = 손 없음).
  # ⚠ 없을 때가 만점이라 n/a 가 필요 없다(그래서 na_allowed 에서 뺐다). 0909 의 '전량 탈락' 사고는
  #   요구하는 방향이라 생겼던 것이고, 이 방향은 기본값이 통과다.
  hands_absent: "No hands, fingers, arms or phone are visible anywhere in either image. 10 = nothing of the sort is in frame. Score low if a hand, finger, arm or the phone appears in either photo, even partially or as a reflection, no matter how well drawn."
  # 2026-09-22 연서님: 미모 프로필 "see-through bangs" 문구로 앞머리가 눈을 가린 컷이 채택까지 갔다(v37 0001 Before).
  #   hands_absent 처럼 '없을 때 만점' 방향이라 기본값이 통과다. 눈이 화면 밖인 크롭은 가릴 눈이 없으니 10(탈락 아님).
  eyes_uncovered: "Both eyes are fully uncovered in BOTH images: no hair, bangs, fringe or strands lie over or cross either eye, eyelid or the iris. 10 = both eyes completely clear in both photos (also 10 if the eyes are outside the frame). Score 3 or lower if hair crosses or covers any part of either eye in either photo, even thin see-through strands."
  skin_texture: "Skin has realistic pores/peach fuzz/minor imperfections, not plastic or repetitive"
  hair: "Hair strands flow naturally, no melted or merged edges"
  identity: "Before and After are unmistakably the same individual: eyes, eyebrows, nose, lips, face shape, moles/freckles all match (hard fail if not)"
  drift: "clinical: nothing outside the treated area changed (expression, angle, lighting, background). selfie: only scene/hair/expression may differ; facial features and treated-area effect must be consistent"
  # 2026-09-11 빌디/성연서님 검수: 09:49 팔자 배치에서 주름 **중앙만** 지워지고 콧볼 쪽·입꼬리 쪽은 그대로였다.
#   종전 문항은 "눈에 띄나"만 물어서 한 토막만 지워진 컷도 통과한다 — 부분 소거는 시술이 아니라 지우개로 보인다.
#   ⚠ 문항 글이 바뀌었으므로 이 줄 앞뒤 회차의 effect_visible 점수는 **다른 자로 잰 값**이다(컷 6 은 그대로).
  effect_visible: "The treatment effect is noticeable but within natural, non-exaggerated range, and it covers the whole treated area: if only part of the treated line or fold changed while the rest of it is unchanged, or one side changed more than the other, score low even when the changed part looks good."
  ai_look: "Overall image does not look AI-generated (no over-symmetry, waxy glow, odd artifacts)"

# 모드별 덮어쓰기 — 여기 적은 키만 `items` 를 이긴다(`vision.score` 가 합친다).
# 2026-09-14 빌디 지적: `drift` 한 줄에 두 모드를 같이 적어 두니 심사가 임상 쪽 뜻으로 읽었다.
#   실측(20260914-085009-06ac/0001): 배경이 차→거실로 바뀐 셀카에 "background and lighting differ"
#   를 이유로 7.0(컷 7, 턱걸이). **다른 날 다시 찍었으니 달라야 정상인 것들에 벌점을 준 것**이라,
#   표정을 31% 바꿔 뽑아도 이 자가 도로 걸러내 살아남는 건 복사본뿐이었다.
#   → 셀카 문항은 "달라도 된다"가 아니라 **"그걸로 감점하지 마라"** 로 못박고, 무엇이 감점인지만 남긴다.
#   ⚠ 문항 글이 바뀌었으므로 이 줄 앞뒤 회차의 셀카 drift 점수는 **다른 자로 잰 값**이다.
#   ⚠ 이 완화만 하면 복사본이 더 쉽게 통과한다 — 반대 방향으로 재는 `structure.copy_check`
#     (복붙 게이트)와 **한 벌이다. 둘 중 하나만 끄지 마라.**
items_selfie:
  drift: >
    Grade only two things: (1) is it the same individual, and (2) is the treated-area effect
    consistent with the before photo. This is a selfie taken on a different day, so a different
    expression, head angle, gaze, hair, clothes, room, background, lighting and time of day are
    all EXPECTED and must never lower the score. Score 10 when the person and the treated-area
    story hold together, even if everything else about the scene changed. Score low only if the
    facial features themselves changed (different bone structure, eye shape, nose, lips), or the
    treated area contradicts the before photo.
items_clinical:
  drift: >
    Nothing outside the treated area changed: expression, head angle, camera distance, lighting
    and background must all match the before photo. Score low for any drift outside the treated
    area, however small.

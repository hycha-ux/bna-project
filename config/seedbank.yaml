      필러: nasolabial            # 볼·팔자·턱끝·이마 필러 묶음 — 팔자 태그가 있어 일단 팔자로
      실리프팅: lifting
      온다리프팅: lifting
      슈링크: lifting
      울쎄라: lifting
      인모드: lifting
      올타이트: lifting
      써펙트리프팅: lifting
      4D미니리프팅: lifting
      이중턱착붙패키지: lifting
      턱선 3종 패키지: lifting
      윤곽주사: lifting
      수면 리투오: lifting
      코코주사: nose_lifting
      퀵코프팅: nose_lifting

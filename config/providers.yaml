# 모드별 기본 프로바이더 + 모델 상수.
#
# 2026-09-08 성연서님 확정: **셀카 모드는 GPT로 못박는다.**
#   근거(docs/selfie-prompt-v1-review-0908-teemo.md 실측):
#   프레이밍 축(코 아래만·한쪽 볼) 준수율 GPT 4/4 vs Gemini 0/4.
#   Gemini 는 부분 크롭 지시를 통째로 무시하고 늘 얼굴 전체를 그려, 레퍼런스(후기 앱) 룩이 안 나온다.
# 셀카는 gen·edit·qa 셋 다 GPT 다 — 한 키로 셀카 파이프가 끝까지 돈다(중간에 다른 벤더를 끼우지 않는다).
# 임상 모드는 종전대로 두었다(빌디 소관).
default_provider:
  selfie:   {gen: openai, edit: openai, qa: openai}
  clinical: {gen: gemini, edit: gemini, qa: gemini}

# 메모 → 규칙 초안(bna/notedraft.py)을 쓰는 벤더. **모드별로 가르지 않는다** —
# 병합 그룹은 셀카·임상 메모가 한 줄에 섞일 수 있어서, 모드로 가르면 같은 표 안에서
# 초안 문체·판정 기준이 그룹마다 갈린다. 한 벌로 고정하고 여기서만 바꾼다.
note_draft: openai

openai:
  image_model: gpt-image-2
  vision_model: gpt-5.1          # 검수(qa) 채점용 비전 모델
  quality: high
  # 레퍼런스 충실도. ⚠ 2026-09-08 실측 — **gpt-image-2 는 이 파라미터를 지원하지 않는다**
  # (400 invalid_input_fidelity_model). 그래서 비워 둔다(비면 아예 안 보낸다).
  # gpt-image-1 계열로 바꿀 때만 high 를 넣어라(토큰이 크게 붙는다: 정사각 +4,160 / 세로·가로 +6,240).
  # 동일인 유지는 이것 없이도 됐다 — 09-08 실측 코사인 0.667(문턱 0.60).
  input_fidelity:
  # aspect → size. gpt-image-2 는 두 변 모두 16의 배수 · 긴변 ≤3840 · 비율 ≤3:1 · 총 픽셀 65.5만~829만.
  # ⚠ 손으로 새 비율을 넣을 땐 이 네 조건을 같이 확인해라(어기면 400 이고, 조용히 다른 비율로 안 바뀐다).
  aspect_size:
    "1:1":  "1024x1024"
    "4:5":  "1024x1280"
    "3:4":  "1152x1536"
    "2:3":  "1024x1536"
    "5:4":  "1280x1024"
    "4:3":  "1536x1152"
    "3:2":  "1536x1024"
    "16:9": "1536x864"
    "9:16": "864x1536"

gemini:
  image_model: gemini-2.5-flash-image

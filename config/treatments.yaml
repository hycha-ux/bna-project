# 시술 정의 — 프롬프트 구조 v2 (2026-09-09, 성연서님 지시 "1단계 구조부터")
#
# 시술 하나당 채우는 칸 (티모 설계안 prompt-design-0907 의 4칸 + 구조 필드)
#   before_condition  : 시술 전 문제 상태 문장 (강도별). 없으면 Before 가 시술을 모른다 → 깨끗한 얼굴이 나온다
#   must_not_change   : 그 시술이 절대 안 건드리는 곳 (After 지시문 뒤에 붙는다). 없으면 얼굴 전체를 손본다
#   scene_allow       : 효과가 보이는 장면만 허용 (셀카). 모드 화이트리스트와 교집합. 모공은 야간 저화질에서 안 보인다
#   drift_lock        : Before→After 사이 바뀌면 안 되는 축 (셀카). 팔자는 표정이 바뀌면 시술 없이도 B&A 가 된다
#   framing_allow     : 시술 부위가 화면에 남는 프레이밍만 (셀카). one_cheek 에서 팔자는 프레임 밖 (0908 실비용 $2.28)
#   framing_ban_by_angle : 각도별 금지 프레이밍 (측면 + 한쪽 볼 = 부위 사라짐)
#   expression_policy : lock = Before/After 표정 동일 강제, free = 달라도 됨 (피부 시술)
#   age_weights       : 시술별 나이 가중치. 0 이면 그 나이는 안 뽑는다 (18세 리프팅 = AI 티)
#   effect_by_severity: Before 강도 ↔ After 효과 허용 짝. mild+moderate 는 과장, marked+subtle 은 효과 없음으로 보인다
#   identity_exempt   : 동일인 잠금에서 뺄 **낱말**(문구 아님 — 잠금 파일 3벌이 표현이 달라 문구로 지우면 한 벌에서만 먹는다, 0909 티모 실측)
#   identity_note     : 그 자리에 대신 넣는 문장 — 시술 부위는 아래 지시대로만 바뀌고 나머지는 그대로
#   axis_ban          : 축별 금지값. 뿔테 안경은 콧대를 가린다 (extras), 목걸이는 목주름을 가린다 (context)
#   mask_region       : qa/landmarks.py 폴리곤 키 (임상 마스크 합성). neck 은 턱선에서 아래로 내린 파생 영역
#   series_levels     : 경과 시점별 효과 강도의 **시술별 재정의**. effects.yaml 의 같은 이름 표를 덮는다.
#                       예) 필러 = {immediate: final, 1w: final} — 여신티켓 3건 실측 "시술효과 약 3일 후"라
#                       직후·1주가 둘 다 결과다. 에너지 시술은 생략(기본값 = 직후 early · 1주 subtle).
#                       ⚠ 한 칸만 올리지 마라 — 직후만 final 이면 1주가 직후보다 약해지는 역전이 생긴다.
#                       ⚠ timeline 에 없는 시점을 적으면 죽은 설정이라 loader 가 막는다.
#                       (2026-09-11 아침의 `immediate_level` 은 같은 날 이 칸으로 승격·폐기됐다)
#   facts             : 시술 사실 카드 (2026-09-11 성연서님 지적 "프롬프트가 시술 자체를 몰라서 계속 어긋난다").
#                       5칸 = onset(효과 시점) / extent(부위 범위) / immediate_marks(직후 흔적: 무엇·어디) /
#                       immediate_avoid(직후 금지) / later(며칠 뒤 상태).
#                       ⚠ **칸마다 읽는 자리가 다르다** — 읽는 코드가 없는 칸은 죽은 설정이 되므로 여기 못 박는다:
#                         · immediate_marks / immediate_avoid → **영어. 직후 After 프롬프트에 그대로 들어간다**
#                           (spec.change_for). 있으면 mode_extra 의 기본 '피부에 아무것도 없음'을 대신한다.
#                         · onset / extent / later → **사람이 읽는 근거 칸**(한국어 가능). 프롬프트 축은 각각
#                           immediate_level · after_change · timeline 이고, 카드는 그 값이 왜 그런지의 출처다.
#                       ⚠ 전부 의료진 검토 전 초안이다. 초안은 성연서님·빌디가 적고 티모가 연결한다.
#
# ※ 문장은 전부 의료진 검토 전 초안 (2026-09-09). before_condition 9종 전부 (티모 0907 초안 기반, 2단계 dry-run 으로 다듬음).
# ※ 필러는 부위마다 Before 가 완전히 달라 한 칸으로 못 쓴다 → 코필러·목주름필러 2종으로 분할 (2026-09-09 성연서님 확정).

nasolabial:
  name_ko: 팔자주름
  region: nasolabial folds (both sides)
  modes: [clinical, selfie]
  angles_clinical: [front, three_quarter]
  mask_region: nasolabial
  timeline: [immediate, 1w, 2w]
  # 2026-09-11 성연서님 "B로 가자" — 필러는 여신티켓 3건 전부 "시술효과 약 3일 후"라
  #   직후·1주 컷이 **둘 다 최종 강도**다. 직후 한 칸만 올리면 1주가 직후보다 약해지는 역전이 생긴다.
  #   붓기·발적은 facts.immediate_marks(있으면) 또는 effects.yaml 의 immediate_final_note 가 얹는다.
  series_levels: {immediate: final, 1w: final}
  effect_levels: [subtle, moderate]
  before_severity: [mild, moderate, marked]
  severity_min_age: {mild: late_20s, moderate: 30s, marked: 40s}
  before_condition:
    mild: >
      This person has never had any aesthetic treatment. The skin is generally fine, but a faint
      nasolabial line is starting to show on each side: a soft crease from the nose toward the
      mouth, visible in this light but not deep. Do not make the face look younger or more
      polished than this; do not exaggerate the line either.
    moderate: >
      This person has never had any aesthetic treatment and the face shows honest age: clearly
      visible nasolabial folds from the sides of the nose to the corners of the mouth with a light
      shadow in the crease, slight loss of mid-face volume. Otherwise ordinary, healthy skin.
      Do not make the face look younger, rested or more attractive than described.
    marked: >
      This person has never had any aesthetic treatment. Pronounced, deep nasolabial folds casting
      a clear shadow, a slightly sagging front cheek, faint marionette lines and a tired under-eye
      area. Do not make the face look younger, rested or more attractive than described.
  # 범위 문장 추가(2026-09-11 빌디/성연서님 검수): 종전엔 "softer and shallower" 까지만 말해 **범위를 안 정했고**,
  #   09:49 배치에서 주름 중앙만 지워지고 콧볼 쪽·입꼬리 쪽은 그대로 남았다. 09-10 메모 "시술 부위 중앙이
  #   잘려서"도 같은 현상이다(그땐 프레이밍 문제로 읽었다). 한 토막만 지워진 주름은 시술이 아니라 지우개로 보인다.
  after_change: >
    the nasolabial folds are softer and shallower than in the reference, the shadow inside the
    crease is lighter, the skin beside the mouth sits a little smoother; the softening runs along
    the entire length of the fold, from beside the nostril down to the corner of the mouth, evenly
    on both sides, with no single segment left unchanged and no segment erased more than the rest;
    same facial structure.
  must_not_change: >
    Do not change lip shape, lip volume, mouth width, nose, or jawline width. Do not smooth,
    brighten or tighten any other part of the face.
  # 사실 카드 — 빌디 초안 `docs/treatment-facts-0911-buildy.md` 를 그대로 옮겼다 (2026-09-11).
  #   ⚠ 의료진 검토 전이다. '며칠 뒤 멍'은 초안에서 미확인으로 표시된 줄이라 프롬프트에 안 실었다.
  facts:
    onset: >
      주입 직후부터 결과가 보인다 (연서님 09-11 "필러는 시술 직후 즉각 나타나는 게 장점인 시술").
      그래서 위 immediate_level 이 final 이다.
    extent: 콧볼 옆에서 입꼬리까지 주름 전 길이, 양쪽 고르게. 프롬프트 축은 위 after_change
    immediate_marks: >
      Because the injections go in beside the mouth, there is one small round skin-coloured
      dressing patch resting on the skin just beside each corner of the mouth, and the treated
      fold is very slightly puffy with a faint pink dot at each injection point.
    # ⚠ `immediate_avoid` 는 일부러 비웠다 — 초안의 '직후 금지'는 크림·거즈·붕대·화장솜 나열인데,
    #   2026-09-10 실측에서 **금지 품목을 적으면 모델이 그걸 그렸다**(마취크림 5/5). 같은 일을
    #   막는 긍정문("시술 설명이 말하는 것만 피부에 있다")이 mode_extra 기본값으로 이미 붙는다.
    later: 1~2주 컷은 테이프 제거 상태, 효과 강도는 직후와 같다. 주입부 작은 멍 가능 여부는 미확인(의료진 확인 대기)
  effect_by_severity: {mild: [subtle], moderate: [subtle, moderate], marked: [moderate]}
  expression_policy: lock          # 웃으면 누구나 팔자가 깊어진다 — 표정 차이가 시술 효과로 둔갑
  drift_lock: [expression, angle]
  scene_allow:
    expression: [neutral_closed, relaxed_open]   # 미소 제외 — 웃으면 시술 없이도 주름이 달라진다
    lighting: [window, fluorescent, ceiling_harsh, mixed]   # 어두운 밤·역광에서는 주름 그림자가 안 보인다
    angle: [front, selfie_3q, selfie_side, chin_up, tilted, selfie_high]   # selfie_low 는 팔자를 과장한다
  framing_allow: [full_face, forehead_cut, lower_face, nose_to_neck, one_cheek]
  # tilted 추가(2026-09-10 검수): 고개를 기울인 채 한쪽 볼만 크게 잡으면 팔자가 프레임 밖으로 밀린다
  #   — 성연서님 "카메라 앵글이 벗어남"(63cb/0005). 같은 배치의 one_cheek×selfie_3q 2장은 채택이라
  #   프레이밍 축 전체를 막지 않고 이 조합만 막는다(학습 장치는 축 단위라 조합을 못 가른다).
  #   ⚠ 근거는 실측 1건이다 — 되돌릴 땐 이 줄에서 tilted 만 빼라.
  framing_ban_by_angle: {selfie_side: [one_cheek], chin_up: [one_cheek], tilted: [one_cheek]}
  age_weights: {late_teens: 0, early_20s: 0, late_20s: 1, "30s": 3, "40s": 3, "50s": 2, "60s": 1}

lifting:
  name_ko: 리프팅
  region: jawline and mid-face
  modes: [clinical, selfie]
  angles_clinical: [front, three_quarter, side]
  mask_region: jawline_midface
  timeline: [2w, 4w]
  effect_levels: [subtle, moderate]
  before_severity: [mild, marked]
  severity_min_age: {mild: 30s, marked: 40s}
  before_condition:
    mild: >
      This person has never had any aesthetic treatment. The jawline is starting to soften: a
      slight fullness forming below the corners of the mouth, the mid-cheek volume sitting a
      little lower than it once did, the jaw contour still visible but no longer crisp.
      Ordinary skin. Do not make the face look younger or firmer than described.
    marked: >
      This person has never had any aesthetic treatment and the lower face shows honest age:
      clearly sagging jawline with visible jowls, mid-face volume descended, a blurred contour
      between the jaw and the neck, faint marionette lines. Ordinary skin. Do not make the face
      look younger, firmer or more attractive than described.
  after_change: >
    jawline slightly firmer and more defined, mid-face lifted subtly, sagging reduced, same
    bone structure.
  must_not_change: >
    Do not change bone structure, face width, or eye shape. Do not slim the face beyond the lift.
  effect_by_severity: {mild: [subtle], moderate: [subtle, moderate], marked: [moderate]}
  expression_policy: lock
  axis_ban: {extras: [mask_chin]}            # 턱에 걸친 마스크가 턱선을 가린다
  identity_exempt: [jawline]                     # 낱말이다 — 잠금 3벌이 "face shape and jawline"·"chin and jawline shape" 로 표현이 갈린다
  identity_note: >
    The bone structure and face shape stay exactly as in the reference; only the softness and
    sagging along the jawline and mid-face change, as described below.
  drift_lock: [expression, angle, quality]   # 위에서 찍으면 시술 없이도 턱선이 올라간다 — 각도 동일이 생명
  scene_allow:
    expression: [neutral_closed, relaxed_open]   # 미소 제외 — 웃으면 시술 없이도 주름이 달라진다
    angle: [front, selfie_3q, tilted]        # selfie_high 금지
    lighting: [window, fluorescent, ceiling_harsh, mixed]
  framing_allow: [full_face, forehead_cut, lower_face, nose_to_neck]
  age_weights: {late_teens: 0, early_20s: 0, late_20s: 1, "30s": 3, "40s": 3, "50s": 3, "60s": 2}

nose_lifting:
  name_ko: 코 리프팅
  region: nose bridge and tip
  modes: [clinical, selfie]
  angles_clinical: [three_quarter, side]
  mask_region: nose
  timeline: [1w, 2w]
  effect_levels: [subtle, moderate]
  before_severity: [mild, marked]
  before_condition:
    mild: >
      This person has never had any aesthetic treatment. The nose bridge is fairly low with a
      soft, undefined profile, and the tip is rounded rather than sharp. Otherwise an ordinary
      face. Do not make the nose look more refined than described.
    marked: >
      This person has never had any aesthetic treatment. The nose bridge is low and flat, almost
      without a visible ridge in profile, and the tip is broad and slightly drooping. Otherwise
      an ordinary face. Do not make the nose look more refined than described.
  after_change: >
    nose bridge slightly higher and straighter, tip slightly more defined, subtle change only,
    rest of the face identical.
  must_not_change: >
    Do not narrow the nostrils or the alar width. Do not change eyes, lips, or face shape.
  effect_by_severity: {mild: [subtle], moderate: [subtle, moderate], marked: [moderate]}
  expression_policy: free
  identity_exempt: [nose]
  identity_note: >
    The nose is the treated area and changes only as described below; its width, the nostrils
    and the alar base stay exactly as in the reference.
  axis_ban: {extras: [glasses, glasses_thick]}   # 안경이 콧대를 가린다
  drift_lock: [angle]                        # 정면만으로는 코 높이 변화가 안 보인다
  scene_allow:
    lighting: [window, fluorescent, ceiling_harsh, mixed]   # 역광·야간은 콧대 윤곽이 안 보인다
    angle: [selfie_3q, selfie_side]          # 셀카 하이/로우 앵글은 코 길이를 왜곡
  framing_allow: [full_face, forehead_cut]   # 콧대가 화면에 있어야 한다
  age_weights: {late_teens: 0, early_20s: 2, late_20s: 3, "30s": 3, "40s": 2, "50s": 0, "60s": 0}

philtrum:
  name_ko: 인중
  region: philtrum
  modes: [clinical, selfie]
  angles_clinical: [front, side]
  mask_region: philtrum
  timeline: [immediate, 1w, 2w]
  # ⚠ 이 키(`philtrum`)와 `nasolabial` 은 이름에 filler 가 안 붙어 있지만 2026-09-11 빌디/성연서님이
  #   필러 계열로 지정했다. **의료진 확인 대기 1건** — 추적 자리는 `docs/treatment-facts-0911-buildy.md`
  #   (성연서님 09-11 "확인해봐야 할 것 같다"). 09-11 여신티켓 3건 실측에도 인중은 없었다
  #   (`docs/yeoshin-filler-0911.md`). 필러가 아니라고 나오면 아래 series_levels 한 줄만 지우면
  #   effects.yaml 기본값(직후 early · 1주 subtle)으로 돌아간다.
  # 2026-09-11 성연서님 "B로 가자" — 필러는 여신티켓 3건 전부 "시술효과 약 3일 후"라
  #   직후·1주 컷이 **둘 다 최종 강도**다. 직후 한 칸만 올리면 1주가 직후보다 약해지는 역전이 생긴다.
  #   붓기·발적은 facts.immediate_marks(있으면) 또는 effects.yaml 의 immediate_final_note 가 얹는다.
  series_levels: {immediate: final, 1w: final}
  effect_levels: [subtle, moderate]
  before_severity: [mild, marked]
  before_condition:
    mild: >
      This person has never had any aesthetic treatment. The philtrum is a little long, with a
      flat upper lip line and a slightly wide gap between the base of the nose and the lip.
      Otherwise an ordinary face. Do not shorten or sharpen the upper lip beyond described.
    marked: >
      This person has never had any aesthetic treatment. The philtrum is clearly long: a wide,
      flat stretch of skin between the nose base and a thin, low upper lip line, which makes the
      upper lip look thin. Otherwise an ordinary face. Do not shorten or sharpen the upper lip
      beyond described.
  after_change: >
    philtrum appears slightly shorter and upper lip line more defined, subtle.
  must_not_change: >
    Do not change lip thickness, lip width, or the nose.
  effect_by_severity: {mild: [subtle], moderate: [subtle, moderate], marked: [moderate]}
  expression_policy: lock                    # 웃으면 인중이 짧아 보인다
  axis_ban: {extras: [mask_chin, beard_light, beard_full]}   # 수염·마스크가 인중을 가린다
  identity_exempt: [philtrum, "lips and mouth width"]   # 아래쪽 잠금엔 "same philtrum" 항목이 따로 있다
  identity_note: >
    The mouth width and lip shape stay exactly as in the reference; only the upper lip line and
    the philtrum length change, as described below.
  drift_lock: [expression, angle]
  scene_allow:
    lighting: [window, fluorescent, ceiling_harsh, mixed]
    expression: [neutral_closed, relaxed_open]   # 미소 제외 — 웃으면 시술 없이도 주름이 달라진다
    angle: [front, selfie_side, selfie_3q, tilted]
  framing_allow: [full_face, forehead_cut, lower_face, nose_to_neck]
  age_weights: {late_teens: 0, early_20s: 2, late_20s: 3, "30s": 3, "40s": 2, "50s": 0, "60s": 0}

skinbooster_embo:
  name_ko: 스킨부스터 엠보
  region: full face skin
  modes: [clinical, selfie]
  angles_clinical: [front]
  mask_region: full_face_skin
  timeline: [1w, 4w]
  effect_levels: [subtle, moderate]
  before_severity: [mild, marked]
  severity_min_age: {mild: early_20s, marked: 30s}
  before_condition:
    mild: >
      This person has never had any aesthetic treatment. The skin looks a little dull and
      dehydrated: uneven light reflection on the cheeks, a few fine dry lines, slightly tired
      tone. Not damaged, just lacking glow. Do not make the skin look fresher than described.
    marked: >
      This person has never had any aesthetic treatment. The skin is dull and dehydrated with a
      rough surface: small flaky patches on the cheeks, fine crepey lines under the eyes and on
      the cheeks, tired uneven tone with no glow. Do not make the skin look fresher or smoother
      than described.
  after_change: >
    skin looks hydrated and plump with a natural glow, fine lines reduced, texture still
    visible (pores, tiny peach fuzz remain), no plastic smoothness.
  must_not_change: >
    Do not remove moles or freckles. Do not change face shape, volume, or features. This is a
    hydration treatment, not a pigment or contour treatment.
  effect_by_severity: {mild: [subtle], moderate: [subtle, moderate], marked: [moderate]}
  expression_policy: free
  axis_ban: {extras: [mask_chin, makeup_light], skin_condition: [clear]}   # 화장·마스크가 피부를 가리고, '깨끗한 피부'는 시술 전 상태와 모순
  drift_lock: [quality, lighting, color]     # 화질·빛이 바뀌면 그게 피부결 변화처럼 보인다
  scene_allow:
    quality: [mid, app_upload]               # 구형폰·전면카메라에서는 피부결 변화가 물리적으로 안 보인다
    lighting: [window, fluorescent, ceiling_harsh]
  framing_allow: [full_face, forehead_cut, lower_face, one_cheek, nose_to_neck]
  age_weights: {late_teens: 0, early_20s: 2, late_20s: 3, "30s": 3, "40s": 3, "50s": 2, "60s": 1}

skin_pores:
  name_ko: 스킨부스터 모공
  region: cheeks and nose
  modes: [clinical, selfie]
  angles_clinical: [front, three_quarter]
  mask_region: cheeks_nose
  timeline: [2w, 4w]
  effect_levels: [subtle, moderate]
  before_severity: [mild, marked]
  before_condition:
    mild: >
      This person has never had any aesthetic treatment. The pores on the cheeks and around the
      nose are visibly enlarged, the skin surface slightly rough and a little oily. Otherwise
      ordinary skin. Do not make the pores smaller or the skin smoother than described.
    marked: >
      This person has never had any aesthetic treatment. The pores are clearly open and dense
      across both cheeks and the nose, an orange-peel skin texture, uneven oily surface with a
      few blackheads. Do not make the pores smaller or the skin smoother than described.
  after_change: >
    enlarged pores visibly tightened and less noticeable, skin still has realistic texture.
  must_not_change: >
    Do not change skin tone, remove moles, or alter face shape. Skin must still show real
    texture after treatment.
  effect_by_severity: {mild: [subtle], moderate: [subtle, moderate], marked: [moderate]}
  expression_policy: free
  axis_ban: {extras: [mask_chin, makeup_light], skin_condition: [clear]}   # 화장·마스크가 피부를 가리고, '깨끗한 피부'는 시술 전 상태와 모순
  drift_lock: [quality, lighting, color]
  scene_allow:
    quality: [mid]                           # 모공은 화면에서 몇 픽셀이냐의 문제 — 가장 좋은 화질만
    lighting: [window, fluorescent, ceiling_harsh]
  framing_allow: [full_face, forehead_cut, lower_face, one_cheek]   # 볼 확대 컷이 실효가 크다
  age_weights: {late_teens: 2, early_20s: 3, late_20s: 3, "30s": 3, "40s": 2, "50s": 1, "60s": 0}

skin_redness:
  name_ko: 스킨부스터 홍조
  region: cheeks
  modes: [clinical, selfie]
  angles_clinical: [front]
  mask_region: cheeks
  timeline: [2w, 4w]
  effect_levels: [subtle, moderate]
  before_severity: [mild, marked]
  before_condition:
    mild: >
      This person has never had any aesthetic treatment. There is noticeable redness across both
      cheeks and beside the nose: uneven, blotchy flushing that stays even at rest. Otherwise
      ordinary skin with normal texture. Do not calm or even out the redness beyond described.
    marked: >
      This person has never had any aesthetic treatment. Strong, blotchy redness across both
      cheeks, the nose and chin, with fine visible capillaries near the nostrils and a hot,
      irritated look; the redness is uneven and patchy. Do not calm or even out the redness
      beyond described.
  after_change: >
    facial redness on cheeks noticeably calmer and more even, skin tone uniform, natural
    texture preserved.
  must_not_change: >
    Do not lighten the overall skin tone or whiten the face. Only the redness pattern changes;
    tone, texture and moles stay the same.
  effect_by_severity: {mild: [subtle], moderate: [subtle, moderate], marked: [moderate]}
  expression_policy: free
  axis_ban: {extras: [mask_chin, makeup_light], skin_condition: [clear]}   # 화장·마스크가 피부를 가리고, '깨끗한 피부'는 시술 전 상태와 모순
  drift_lock: [color, lighting]              # 따뜻한 색감은 홍조를 만들고 차가운 색감은 지운다 — 화이트밸런스가 시술로 둔갑
  scene_allow:
    color: [neutral]
    lighting: [window, fluorescent]
  framing_allow: [full_face, forehead_cut, lower_face, one_cheek]
  age_weights: {late_teens: 2, early_20s: 3, late_20s: 3, "30s": 3, "40s": 2, "50s": 2, "60s": 1}

filler_nose:
  name_ko: 코 필러
  region: nose bridge and tip
  modes: [clinical, selfie]
  angles_clinical: [three_quarter, side]
  mask_region: nose
  timeline: [immediate, 1w, 2w]
  # 2026-09-11 성연서님 "B로 가자" — 필러는 여신티켓 3건 전부 "시술효과 약 3일 후"라
  #   직후·1주 컷이 **둘 다 최종 강도**다. 직후 한 칸만 올리면 1주가 직후보다 약해지는 역전이 생긴다.
  #   붓기·발적은 facts.immediate_marks(있으면) 또는 effects.yaml 의 immediate_final_note 가 얹는다.
  series_levels: {immediate: final, 1w: final}
  effect_levels: [subtle, moderate]
  before_severity: [mild, marked]
  before_condition:
    mild: >
      This person has never had any aesthetic treatment. The nose bridge is fairly low and flat
      with a slight dip between the eyes, and the tip is soft and rounded rather than defined.
      Otherwise an ordinary face. Do not make the nose look more refined than described.
    marked: >
      This person has never had any aesthetic treatment. The nose bridge is low and flat, almost
      without a visible ridge in this light, and the tip is broad, rounded and slightly drooping.
      Otherwise an ordinary face. Do not make the nose look more refined than described.
  after_change: >
    nose bridge raised and straighter with a continuous line from between the eyes to the tip,
    tip slightly more projected and defined, natural filler result.
  must_not_change: >
    Do not narrow the nostrils or the alar width. Do not change eyes, lips, cheeks, chin, or
    face shape. Do not brighten or smooth the skin.
  effect_by_severity: {mild: [subtle], marked: [moderate]}
  expression_policy: free
  identity_exempt: [nose]
  identity_note: >
    The nose is the treated area and changes only as described below; its width, the nostrils
    and the alar base stay exactly as in the reference.
  axis_ban: {extras: [glasses, glasses_thick]}   # 안경이 콧대를 가린다
  drift_lock: [angle]                        # 코 높이는 각도가 조금만 달라도 다르게 보인다
  scene_allow:
    angle: [selfie_3q, selfie_side]          # 정면은 코 높이 변화가 안 보이고, 하이/로우 앵글은 코 길이를 왜곡
    lighting: [window, fluorescent, ceiling_harsh, mixed]
  framing_allow: [full_face, forehead_cut]   # 콧대(미간~코끝)가 화면에 있어야 한다. lower_face 는 콧대가 잘린다
  age_weights: {late_teens: 0, early_20s: 3, late_20s: 3, "30s": 3, "40s": 2, "50s": 0, "60s": 0}

filler_neck:
  name_ko: 목주름 필러
  region: horizontal neck lines (front of the neck)
  modes: [clinical, selfie]
  angles_clinical: [front, three_quarter, side]
  mask_region: neck                          # 얼굴 랜드마크에 목이 없다 — 턱선에서 아래로 내린 파생 영역 (landmarks.py)
  timeline: [immediate, 1w, 2w]
  # 2026-09-11 성연서님 "B로 가자" — 필러는 여신티켓 3건 전부 "시술효과 약 3일 후"라
  #   직후·1주 컷이 **둘 다 최종 강도**다. 직후 한 칸만 올리면 1주가 직후보다 약해지는 역전이 생긴다.
  #   붓기·발적은 facts.immediate_marks(있으면) 또는 effects.yaml 의 immediate_final_note 가 얹는다.
  series_levels: {immediate: final, 1w: final}
  effect_levels: [subtle, moderate]
  before_severity: [mild, marked]
  severity_min_age: {mild: late_20s, marked: 40s}
  before_condition:
    mild: >
      This person has never had any aesthetic treatment. On the front of the neck there are two
      faint horizontal lines, like a light necklace mark, visible when the chin is slightly
      lifted, with normal skin between them. Do not exaggerate the lines or add sagging.
    marked: >
      This person has never had any aesthetic treatment. The front of the neck shows two or three
      distinct horizontal creases running around the neck, with slightly crepey, loose skin
      between them and a faint shadow inside each crease. Do not make the neck look younger or
      smoother than described.
  after_change: >
    the horizontal neck lines are softer and shallower than in the reference, the skin between
    them sits smoother and more even, the neck still looks like real skin with natural texture.
  must_not_change: >
    Do not change the jawline, chin, face, or the length and width of the neck. Do not whiten
    or blur the neck skin; keep pores and natural texture. Do not remove moles on the neck.
  effect_by_severity: {mild: [subtle], marked: [moderate]}
  expression_policy: free
  drift_lock: [angle]                        # 턱을 들고 내리는 것만으로 목주름이 생기고 사라진다
  axis_ban: {context: [necklace]}            # 목걸이가 주름을 가린다
  scene_allow:
    angle: [chin_up, front, selfie_3q]       # selfie_high 는 목이 안 보인다
    lighting: [window, fluorescent, ceiling_harsh, mixed]
  framing_allow: [nose_to_neck, neck_only]   # 목이 화면에 있어야 한다. neck_only 는 이 시술 전용 프레이밍
  # ⚠ 목주름만 전역 프레이밍 가중을 되돌린다(2026-09-11 성연서님 "목주름은 목만 프레이밍이 필수").
  #   전역에서 neck_only 를 0.25 로 낮추자 이 시술에서도 14.7% 로 떨어졌는데, 목만 컷은
  #   이 시술의 대표 구도다 — 전역 규칙의 부수 피해라 여기서 되돌린다(→ 약 25%).
  # ⚠ 그리고 **목주름은 못 잼 10% 목표에서 빠진다.** 목만 컷은 얼굴이 아예 프레임 밖이고,
  #   그나마 나은 nose_to_neck 도 실측 12.5% 라 **두 칸을 어떻게 섞어도 10% 아래가 안 된다**
  #   (neck_only 를 0 으로 죽여도 12.5%). 이 시술의 동일인 판정은 기계가 아니라 사람 몫이고,
  #   검수 화면이 identity.gate=="n/a" 로 그 컷을 갈라 준다.
  framing_weights: {neck_only: 2}            # 전역 0.25 × 2 = 0.5 (≈ 25% 등장, 예상 못 잼 ≈ 28%)
  age_weights: {late_teens: 0, early_20s: 0, late_20s: 1, "30s": 3, "40s": 3, "50s": 3, "60s": 2}

filler_eyelid:
  name_ko: 눈꺼풀·눈가 필러
  # 2026-09-11 성연서님 지시로 신설. 원천 = 여신티켓 26126 "당일 만족 눈꺼풀필러, 눈가주사 볼륨필러"
  #   (부위 "눈꺼풀, 눈가" · 크림마취 · 10~20분 · 회복 약 1주 · 시술효과 약 3일 후).
  #   실측 원문 = `docs/yeoshin-filler-0911.md`. 효과·범위 문장은 **의료진 검토 전 초안**이다.
  region: hollow upper eyelids and the hollows under the eyes (both sides)
  modes: [clinical, selfie]
  angles_clinical: [front, three_quarter]
  mask_region: eye_area
  timeline: [immediate, 1w, 2w]
  series_levels: {immediate: final, 1w: final}   # 필러 — 직후·1주 둘 다 결과 (B안)
  effect_levels: [subtle, moderate]
  before_severity: [mild, marked]
  severity_min_age: {mild: late_20s, marked: 40s}
  before_condition:
    mild: >
      This person has never had any aesthetic treatment. The upper eyelids look a little hollow,
      with a slight sunken groove under the brow bone, and there is a faint shadowed hollow under
      each eye that makes the person look tired even at rest. Otherwise an ordinary face. Do not
      make the eyes look brighter, larger or more rested than described.
    marked: >
      This person has never had any aesthetic treatment. The upper eyelids are clearly hollow: a
      deep groove under the brow bone so the eyelid skin folds inward, and under each eye a
      pronounced hollow with a dark shadow running from the inner corner toward the cheek. The
      whole eye area looks sunken and tired. Do not make the eyes look brighter, larger, younger
      or more rested than described.
  # 범위를 못 박는 이유 = 09-11 팔자 사고와 같다(중앙만 지워지고 양끝이 남았다).
  after_change: >
    the hollow under the brow bone and the hollow under each eye are filled out and smoother than
    in the reference, so the eye area sits level with the skin around it and the shadow inside the
    hollow is lighter; the filling runs along the whole hollow, from the inner corner beside the
    nose out to the outer corner, evenly on both eyes, with no single segment left unchanged;
    the eye opening, the eyelid line and the eyebrow position are unchanged.
  # ⚠ 다크서클은 두 가지다 — 꺼짐이 만드는 **그림자**와 피부 **색소**. 필러는 앞의 것만 고친다.
  #   색소까지 지우면 이 시술이 못 하는 일을 광고하는 그림이 된다.
  must_not_change: >
    Do not change the shape, size, spacing or opening of the eyes, the double-eyelid line, the
    eyelashes, or the position and shape of the eyebrows. Do not lighten dark pigmentation of the
    skin, whiten the under-eye area, or smooth wrinkles elsewhere on the face; only the hollow is
    filled in. Do not change the nose, cheeks, or face shape.
  effect_by_severity: {mild: [subtle], marked: [moderate]}
  expression_policy: lock        # 웃으면 눈이 접히고 애교살이 생겨 시술 없이도 눈밑이 달라진다
  identity_exempt: [eyes]        # 낱말이다 — "same eyes (shape, size, spacing, eyelid type)" 항목을 뺀다
  identity_note: >
    The eye shape, size, spacing and eyelid line stay exactly as in the reference and the eyes are
    open the same amount; only the hollowness around them fills out, as described below.
  # ⚠ tired 는 "faint dark circles" 라 After 의 소품 줄에 붙으면 방금 채운 눈밑을 도로 어둡게 만든다.
  #   makeup_light(컨실러)·안경은 눈가를 가린다.
  axis_ban: {extras: [glasses, glasses_thick, makeup_light, tired]}
  drift_lock: [expression, angle, lighting]   # 눈밑 그림자는 빛이 만든다 — 조명이 바뀌면 그게 효과로 둔갑
  scene_allow:
    expression: [neutral_closed, relaxed_open]
    lighting: [window, fluorescent, ceiling_harsh, mixed]   # 역광·야간은 눈가가 통째로 어두워 판정 불가
    angle: [front, selfie_3q, tilted]                       # chin_up 은 눈밑이 가려지고 selfie_low 는 꺼짐을 과장
  # ⚠ 눈이 프레임에 있어야 한다. lower_face 계열은 잠금 파일이 다르고(identity_lock_lower) 거기엔
  #   "eyes" 항목 자체가 없어 identity_exempt 가 아무것도 못 지우고 터진다 — 막는 게 아니라 설계다.
  framing_allow: [full_face, forehead_cut]
  age_weights: {late_teens: 0, early_20s: 1, late_20s: 2, "30s": 3, "40s": 3, "50s": 2, "60s": 1}

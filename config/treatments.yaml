# 시술 정의. 프롬프트 조립 시 after_change 가 After 편집 지시문의 핵심.
# 원칙: 변화는 "자연스러운 개선" 범위. 과장 금지.
# mask_region  : qa/landmarks.py 의 부위 폴리곤 키 (마스크 편집·합성용)
# effect_levels: 효과 강도 축 (subtle/moderate). 프롬프트에 강도 문구 삽입
# timeline     : 경과 시점 축. 셀카 모드에서 잔여 홍조 등 디테일에 사용
# ※ 지시문 의료진 검토는 추후 진행 (2026-09-07 기준 미검토, 모두 오픈)
nasolabial:
  name_ko: 팔자주름
  region: nasolabial folds (both sides)
  after_change: 'nasolabial folds visibly softened and shallower, skin around the mouth smoother, same
    facial structure, no change to lips or nose.

    '
  modes:
  - clinical
  - selfie
  angles_clinical:
  - front
  - three_quarter
  mask_region: nasolabial
  effect_levels:
  - subtle
  - moderate
  timeline:
  - immediate
  - 2w

# 효과 강도·경과 시점 문구
effect_levels:
  subtle: "The change is mild: the treated area is better than in the reference but the concern is still present, noticeable mainly when the two photos are compared side by side"
  moderate: "The change is clear when the two photos are compared, but still within what a single treatment realistically does; nothing looks perfect or erased"
timeline:
  immediate: "photographed right after the procedure; faint redness or slight swelling in the treated area is acceptable"
  1w: "photographed about one week after the procedure; treated area fully settled, very faint residual redness possible"
  2w: "photographed about two weeks after the procedure; fully settled, no marks"
  4w: "photographed about four weeks after the procedure; fully settled, no marks"

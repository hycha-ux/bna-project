# 임상(후기)용 촬영 리그 프로파일 (2026-09-15 v1, 연서님 레퍼런스 3장 기준).
#
# 임상 사진의 특징 = **같은 자리, 같은 배경, 같은 조명**으로 다시 찍은 사진. 그런데 픽셀 복사가 아니다 —
#   머리 위치가 몇 mm·몇 도 다르고, 잔머리·헤어라인이 다르고, 미세 주름과 표정의 결이 살짝 다르고,
#   다른 날이면 옷이 다르다. 이 '살짝 다름'이 진짜 임상 사진의 표식이라 프롬프트가 **일부러** 요구한다.
#
# 종전(0907) 리그 하나 = "미러리스 85mm + 소프트박스 2개 + 회색 무지 배경"은 실제 병원 사진보다 훨씬 깨끗했다.
#   레퍼런스: ① 회색 배경·스튜디오 플래시 ② 파란 배경·병원 플래시·색온도 어긋남 ③ 병원 벽·천장등·로고 헤어밴드·컴팩트 카메라.
#   → 리그 3벌. 세트마다 하나를 뽑고 **세트 안(전·후)에서는 고정**. spec.build_prompts 가 고른다.

rigs:
  grey_studio:
    label: "회색 무지 배경 · 스튜디오 조명"
    camera: "clinic documentation camera, DSLR with 85mm lens, f/8, whole face in focus, no bokeh"
    distance: "camera about 1.2m from the face, on a tripod at eye level"
    lighting: "two softbox lights left and right, even illumination with soft shadows under the chin and beside the nose, neutral white balance"
    background: "plain light grey paper backdrop, slightly uneven in tone"
    subject_setup: "hair kept off the face, no or very light everyday makeup, no earrings, a plain top or a clinic gown, neutral expression, mouth closed, eyes to camera"
    processing: "straight out of camera, neutral color, no retouching, moderate sharpness"
  blue_backdrop:
    label: "파란 배경 · 병원 플래시"
    camera: "clinic photo booth camera, DSLR with on-camera flash, everything sharp, no bokeh"
    distance: "camera about 1.5m from the face, at eye level"
    lighting: "on-camera flash mixed with room light, flat frontal light, a faint flash shadow on the backdrop behind the head, white balance slightly off"
    background: "plain blue photo backdrop with a little fabric texture"
    subject_setup: "hair pushed behind the ears or tied back, no or very light everyday makeup, ordinary clothes, neutral expression, mouth closed, eyes to camera"
    processing: "straight out of camera, slightly cool color, no retouching, moderate sharpness"
  clinic_wall:
    label: "병원 벽 · 천장등 · 헤어밴드"
    camera: "compact camera or phone used at the clinic front desk, everything in focus, ordinary consumer image quality"
    distance: "camera about 1m from the face, held at eye level"
    lighting: "clinic ceiling fluorescent light from above, slightly flat, slightly yellow-green cast, mild shadows under the brows and chin"
    background: "plain painted clinic wall in an off-white or pale color, a corner or door frame edge may show"
    subject_setup: "hair held back with a plain fabric headband, no or very light everyday makeup, ordinary clothes, neutral expression, mouth closed, eyes to camera"
    processing: "straight out of camera, no retouching, ordinary consumer sharpness and a little noise"

angles:
  front: "exact frontal view, head level, Frankfort plane horizontal"
  oblique_45: "45 degree oblique view to the left, head level"
  side: "true side profile facing left, head level"

# 다시 찍기(After) 규정 — 시점에 따라 고른다. same_day = 직후, different_day = 1주 이후.
# ⚠ '똑같이'가 아니라 '같은 부스에서 따로 찍은 사진'이다. 아래 micro_drift 가 그 살짝 다름을 요구한다.
# ⚠ 2026-09-15 저녁 연서님: "옷은 똑같은 걸 유지하되 조금씩 틀어져야" — 종전 different_day 의 '옷 다름'을 뺐다.
#   레퍼런스 ②는 옷이 달랐지만 기준은 연서님 규정이다. 옷·머리 모양은 같고, 매무새·잔머리만 틀어진다.
retake:
  same_day: >
    This is a second photo taken in the same clinic photo spot later the same day: the same backdrop,
    the same lamps in the same positions, the same camera at the same distance and height, the same
    framing, the same clothes and the same hairstyle. It is a separate exposure, not a copy of
    the reference.
  different_day: >
    This is a second photo taken in the same clinic photo spot on a later visit: the same backdrop,
    the same lamps in the same positions, the same camera at the same distance and height, the same
    framing, the same kind of clothes and the same hairstyle. It is a separate exposure taken on
    another day, not a copy of the reference.

# 두 시점 공통: '살짝 다름'을 **필수**로 요구한다.
# 2026-09-15 저녁 첫 실회차 연서님 지적 3개를 항목으로 박았다 — ①잔머리 틀어짐 ②눈 뜬 정도·입 모양 ③옷 매무새.
#   종전 문장은 "살짝 다르다"고 뭉뚱그려서 모델이 전부 무시했다. 항목마다 '무엇이 어떻게' 다른지 적는다.
micro_drift: >
  This must not be a copy of the reference: it is a separate exposure and it must look like one.
  Hair: the same hairstyle, but the loose strands, flyaways and the hairline edge fall differently -
  a strand that was tucked is now loose, a wisp sits on the other side, the parting is a few
  millimetres off. Face: the eyes are open a slightly different amount, the gaze is a hair off,
  the lips rest in a slightly different way, so the fine lines around the eyes and mouth read a
  little differently while the expression stays neutral. Clothes: the same clothes, but the collar,
  neckline, straps and folds sit differently - shifted, rumpled or straightened compared with the
  reference. Body: the head sits a few millimetres and a degree or two differently, the shoulders
  are not in exactly the same place, and the exposure is a touch brighter or darker.
  If the two photos overlap pixel for pixel outside the treated area, the result is wrong.

# 임상 After 스타일 참조 (2026-09-15 티모, 연서님 결정 안). 켜면 같은 리그·같은 시점의 After 참조를 Before 뒤에
#   붙이고 "얼굴은 1번 사진" 문구(prompts/edit_style_refs.md)를 더한다. 맞는 참조가 없으면 종전 1장 편집.
#   ⚠ 참조는 남의 얼굴이다 — 첫 실회차에서 켠 것/끈 것의 동일인 점수를 같은 seed 로 비교해 판정.
# ⚠ 2026-09-15 저녁 **껐다** — 첫 실회차에서 볼에 시술이 들어갔다. 팔자 After 참조(nasolabial_after2w_01)는
#   서구 중안면 필러 사진이라 볼 볼륨이 참조에서 옮겨왔을 가능성이 크다. 한국인 임상 참조가 생기면 다시 켠다.
#   (빌디가 cef9892 에서 이 블록을 실수로 지웠다 — 그 사이 .get() 이 None 이라 꺼진 채였다. 여기 복구.)
after_style_refs: false

# 구조 검사 임계값 (임상 모드에만 적용)
# 정렬 허용 2% → 4% (2026-09-15 연서님 결정). 티모 실측: 연서님 레퍼런스의 **진짜 임상 쌍**이 눈 중심 이동
#   2.65% 라 2% 면 레퍼런스 자체가 탈락한다. 합성을 끈 대신 여기서 잡는다.
#   리프팅 2쌍 재측정(같은 날 2차, tools/_probe_composite_0915.py): lifting_01 = 2.07% 이지만 **눈이 프레임 밖**(코 아래 컷)이라
#   MediaPipe 가 지어낸 눈 좌표다(참고치) · lifting_02 = 전·후 가로 폭이 달라(282 vs 309px, 원본 콜라주를 다르게 자름)
#   오른쪽 맞춤 가정 3.59% / 왼쪽 맞춤 14.8%(화면상 불가능) → 3.59% 로 읽는다(추정). 믿을 수 있는 값 중 4% 를 넘는 쌍은 없다.
#   ⚠ 여유가 얇다(3.59 vs 4.0, 다른 날 촬영 clinic_wall). 실회차에서 '진짜 같은데 정렬로 탈락'이 나오면 5% 후보.
#   luma_diff 0.05 그대로 (3쌍 실측 0.013·0.014·0.037) · face_ratio_diff 0.03 그대로 (3쌍 0.003·0.010·0.002).
tolerance:
  landmark_align_pct: 4.0     # 눈 중심 거리 대비 위치 오차 %
  face_ratio_diff: 0.03       # 얼굴 세로 비율 차이
  luma_diff: 0.05             # 평균 밝기 차이

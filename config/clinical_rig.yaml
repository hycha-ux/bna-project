after_style_refs: true

# 임상 '너무 같음' 자 (2026-09-28 빌디 요청 ②, 판정 = structure.clinical_copy_check).
#   근거 = tools/clinical_copy_calib.py → outputs/rescore/clinical_copy_calib.json:
#     실제 전·후 참조 3쌍(다른 날 촬영): 닮음 0.750·0.761(1쌍은 눈 밖 크롭이라 못 잼) · 정렬 2.07~2.65% · 기울기 차 <1°
#     09-15 생성 21장(사람 판정 21/21 reject 'AI 티'): 닮음 **0.860~0.945** · 정렬 0.33~8.80% · 고개 차 0.001~0.008
#   → 가르는 축은 닮음이다(참조 최대 0.761 < 생성 최소 0.860). 0.82 = 그 골짜기이자 셀카 TOO_SIMILAR 와 같은 값.
#     정렬은 복사본도 0.3~8.8% 로 퍼져 **하한 1% 는 명백한 픽셀 복사만** 잡는다(21장 중 1장). 허용 창 = 1~4%(상한은 tolerance).
#     고개 벡터는 참조(0.005~0.009)와 생성(0.001~0.008)이 겹쳐 안 쓴다.
#   규칙: 닮음 ≥ sim_max **또는** 정렬 < align_min_pct 이면 '너무 같음'. 단 눈 선 기울기 차 ≥ roll_deg 면 다름(미모 v41 과 같은 인정).
#   ⚠ 참조 3쌍(유효 닮음 2쌍)으로 잡은 값이라 얇다 — 다음 회차들의 사람 판정과 대 보고 다시 잰다.
#   ⚠ 2026-09-28 1회차(v46, 2세트·그린 6장): **6/6 이 닮음으로 걸려 0장 완성**($1.90). 그중 0001 최종(닮음 0.899)은 눈으로
#     보면 잔머리·빛·위치가 달라진 제대로 된 재촬영에 팔자도 옅어졌다 — 09-15 복사본(0.86~0.94)과 닮음 값이 겹친다.
#     즉 참조 2쌍(0.75)으로 잡은 0.82 는 편집 모델이 내는 '좋은 재촬영'까지 죽인다. → **기록 전용**으로 내리고(record_only)
#     사람 판정(똑같음/얼굴/피부 메모)과 대 본 뒤 컷을 다시 정한다(09-18·09-21 '게이트는 분포를 본 다음'과 같은 순서).
#     정렬 < 1% 도 같이 기록 전용이다(한 스위치). 되돌리기 = record_only: false.
#   ⚠ 2026-09-28 3차 연서님 "0.90 켜줘" — 사람 채택 3장(v46 r1 0000·r2 0000-t2·0001-t2)이 닮음 0.88~0.89, 버린 22장 중 18장이 ≥0.90.
#     게이트로 다시 켰다(record_only 해제). 컷 = 0.90. 채택이 3장뿐이라 여유가 0.01 이다 — 새 회차 사람 판정으로 다시 재라.
#   ⚠ 2026-09-28 4차 연서님 "내 기준은 닮음이 아니라 효과야 — 기록 전용으로 되돌려줘": v49 에서 0.90 이 채택 컷 0002(0.943, 2주)를
#     떨어뜨렸다. 같은 인물 t1·t2(0.95~0.97)는 '효과 없음'으로 뺐다 — 닮음이 높아도 효과가 보이면 채택, 낮아도 안 보이면 버림.
#     → 기록 전용. 닮음은 사람 판정을 못 가른다(셀카 09-22 미모 교훈과 같은 결론).
copy_gate: {sim_max: 0.90, align_min_pct: 1.0, roll_deg: 10, record_only: true}

# 구조 검사 임계값 (임상 모드에만 적용)
# 정렬 허용 2% → 4% (2026-09-15 연서님 결정). 티모 실측: 연서님 레퍼런스의 **진짜 임상 쌍**이 눈 중심 이동
#   2.65% 라 2% 면 레퍼런스 자체가 탈락한다. 합성을 끈 대신 여기서 잡는다.
#   리프팅 2쌍 재측정(같은 날 2차, tools/_probe_composite_0915.py): lifting_01 = 2.07% 이지만 **눈이 프레임 밖**(코 아래 컷)이라
#   MediaPipe 가 지어낸 눈 좌표다(참고치) · lifting_02 = 전·후 가로 폭이 달라(282 vs 309px, 원본 콜라주를 다르게 자름)
#   오른쪽 맞춤 가정 3.59% / 왼쪽 맞춤 14.8%(화면상 불가능) → 3.59% 로 읽는다(추정). 믿을 수 있는 값 중 4% 를 넘는 쌍은 없다.
#   ⚠ 여유가 얇다(3.59 vs 4.0, 다른 날 촬영 clinic_wall). 실회차에서 '진짜 같은데 정렬로 탈락'이 나오면 5% 후보.
#   luma_diff 0.05 그대로 (3쌍 실측 0.013·0.014·0.037) · face_ratio_diff 0.03 그대로 (3쌍 0.003·0.010·0.002).
# 2026-09-28 연서님 "임상 구조 자는 탈락 시 자동 재시도 말고 기록 전용으로. 어차피 내가 검수하니까 다 보여줘".
#   v47 r2: 얼굴 폭 4.3~4.5%·밝기 0.10 으로 3번씩 다시 그렸고, 연서님이 괜찮게 본 1·2번 시도가 사라졌다.
#   아래 tolerance 는 그대로 재고 meta.structure 에 남는다(record_only 표시). 되돌리기 = false.
structure_record_only: true
tolerance:
  # 2026-09-28 연서님 4% → 8% — 사람 채택 컷이 정렬 4.0·7.1% 였다(진짜 임상 쌍 2.1~2.7% 보다 넓게 움직여도 채택). 구조 자는 기록 전용.
  landmark_align_pct: 8.0     # 눈 중심 거리 대비 위치 오차 %
  face_ratio_diff: 0.03       # 얼굴 세로 비율 차이
  luma_diff: 0.05             # 평균 밝기 차이

# 임상(후기)용 촬영 리그 프로파일 (2026-09-15 v1, 연서님 레퍼런스 3장 기준).
#
# 임상 사진의 특징 = **같은 자리, 같은 배경, 같은 조명**으로 다시 찍은 사진. 그런데 픽셀 복사가 아니다 —
#   머리 위치가 몇 mm·몇 도 다르고, 잔머리·헤어라인이 다르고, 미세 주름과 표정의 결이 살짝 다르고,
#   다른 날이면 옷이 다르다. 이 '살짝 다름'이 진짜 임상 사진의 표식이라 프롬프트가 **일부러** 요구한다.
#
# 종전(0907) 리그 하나 = "미러리스 85mm + 소프트박스 2개 + 회색 무지 배경"은 실제 병원 사진보다 훨씬 깨끗했다.
#   레퍼런스: ① 회색 배경·스튜디오 플래시 ② 파란 배경·병원 플래시·색온도 어긋남 ③ 병원 벽·천장등·로고 헤어밴드·컴팩트 카메라.
#   → 리그 3벌. 세트마다 하나를 뽑고 **세트 안(전·후)에서는 고정**. spec.build_prompts 가 고른다.

rigs:
  grey_studio:
    label: "회색 무지 배경 · 스튜디오 조명"
    camera: "clinic documentation camera, DSLR with 85mm lens, f/8, whole face in focus, no bokeh"
    distance: "camera about 1.2m from the face, on a tripod at eye level"
    lighting: "two softbox lights left and right, even illumination with soft shadows under the chin and beside the nose, neutral white balance"
    background: "plain light grey paper backdrop, slightly uneven in tone"
    subject_setup: "hair kept off the face, no or very light everyday makeup, no earrings, a plain top or a clinic gown, neutral expression, mouth closed, eyes to camera"
    processing: "straight out of camera, neutral color, no retouching, moderate sharpness"
  blue_backdrop:
    label: "파란 배경 · 병원 플래시"
    camera: "clinic photo booth camera, DSLR with on-camera flash, everything sharp, no bokeh"
    distance: "camera about 1.5m from the face, at eye level"
    # 2026-09-28 빌디 요청 ⑤(미모 v34 교훈): 평평한 정면 플래시는 주름 그림자를 지워 Before 에서 팔자가 안 읽힌다.
    #   플래시가 렌즈보다 살짝 위·한쪽이라 코 옆·입가 주름에 **얇은 그림자 경계가 남는다**를 적었다(전·후 같은 리그라 둘 다 붙는다).
    lighting: "on-camera flash mixed with room light, the flash sits a little above and to one side of the lens so the light is mostly frontal but the creases beside the nose and around the mouth still keep a thin shadow edge, a faint flash shadow on the backdrop behind the head, white balance slightly off"
    background: "plain blue photo backdrop with a little fabric texture"
    subject_setup: "hair pushed behind the ears or tied back, no or very light everyday makeup, ordinary clothes, neutral expression, mouth closed, eyes to camera"
    processing: "straight out of camera, slightly cool color, no retouching, moderate sharpness"
  clinic_wall:
    label: "병원 벽 · 천장등 · 헤어밴드"
    camera: "compact camera or phone used at the clinic front desk, everything in focus, ordinary consumer image quality"
    distance: "camera about 1m from the face, held at eye level"
    # 2026-09-28 연서님 "Before 여섯 장 다 팔자가 얕아 — 측광 리그로 골이 읽히게": 위에서 오는 빛이 만드는 주름 그림자를 문장에 적었다.
    lighting: "clinic ceiling fluorescent light from above and slightly to one side, slightly yellow-green cast, mild shadows under the brows and chin, and the light from above leaves a visible shadow line inside the creases beside the nose and down from the corners of the mouth"
    background: "plain painted clinic wall in an off-white or pale color, a corner or door frame edge may show"
    subject_setup: "hair held back with a plain fabric headband, no or very light everyday makeup, ordinary clothes, neutral expression, mouth closed, eyes to camera"
    processing: "straight out of camera, no retouching, ordinary consumer sharpness and a little noise"

# 리그 추첨 가중 (2026-09-28 빌디 요청 ⑤ "Before 에서 주름이 읽히게"). 천장등(clinic_wall)·좌우 소프트박스(grey_studio)는
#   위·옆에서 빛이 와서 주름 그림자가 남고, 정면 플래시(blue_backdrop)는 평평해 주름이 덜 읽힌다 → 2:2:1.
#   없으면 종전 균등 추첨. 0 은 쓰지 마라(빼기는 rigs 목록이 할 일). 정본 = spec.build_prompts 리그 추첨.
#   ⚠ 2026-09-28 5차 연서님 "Before 여섯 장 다 팔자가 얕아 — 측광 리그(clinic_wall) 가중 올리고 플래시 비중 낮춰" → 5:2:1
#     (clinic_wall 62.5% · grey_studio 25% · blue_backdrop 12.5%).
rig_weights: {clinic_wall: 5, grey_studio: 2, blue_backdrop: 1}

# 임상 2단계 편집 (2026-09-28 연서님, 정본 = batch.one_after 임상 갈래). 1단계 = 다시 찍기(마스크 없음),
#   2단계 = After 자신의 얼굴 점으로 만든 팔자·마리오네트 마스크 안에서만 골을 옅게(문안 = prompts/after_clinical_pass2.md).
#   근거: v49 확대 비교(tools/fold_zoom.py) — 1단계만으로는 부위 쏠림 0.68~1.1배(팔자를 따로 안 건드림).
#   비용: 컷당 편집 1회 추가. 되돌리기 = enabled: false.
#   2026-09-28 6차 연서님 "실제 After 참조(nasolabial_after2w_01)를 '골 깊이는 이 정도로'라고 같이 붙여줘" → depth_ref.
#     v50 에서 2단계가 골을 거의 안 바꿨다(0000 골 대비 -0.3%). 문장 대신 목표 사진을 준다(미모 v40~44: 사진이 문장보다 먹는다).
#     ⚠ 이 참조는 서구 중안면 필러 사진이라 09-15 에 볼 볼륨이 옮았다 — 문구가 '골 깊이만'이라고 막고, 합성은 마스크 안만이다.
second_pass: {enabled: true, feather: 14, depth_ref: clinical/nasolabial_after2w_01.jpg}

# 임상 After 만드는 법 (2026-09-28 7차 연서님 B "임상 After도 셀카처럼 새로 그리기"). edit = 종전(Before 를 고쳐 그림, 2단계 편집 포함) /
#   generate = Before 를 참조로 새로 그림(셀카 경로 — 2단계 편집은 edit 갈래에만 있어 자동으로 꺼진다).
#   근거: v50·v51 편집은 문장·마스크·목표 사진 어느 쪽으로도 팔자를 안 옅게 했다(골 대비 변화 ±0.4%, 5컷). 되돌리기 = edit.
after_generation: generate

# 골 메우기 + 재촬영 (2026-09-28 12차 연서님 "11차 설정을 임상 기본으로"). 정본 = batch.one_after 임상 갈래 끝 + bna.foldlift.fill_to.
#   edge_pct = 골 선 선명도 목표(이 세트 Before 대비 %) — 실제 쌍 -43.7%(목표)와 1.5배 -65.6% 의 사이. shade_pct = 그늘 보조 목표.
#   retake = 메운 뒤 편집 모델 '그대로 다시 촬영' 1회(컷당 편집 1회 추가 비용). 근거·시행착오 = LESSONS 09-28 7~11차.
#   되돌리기 = enabled: false (B 새로 그리기만 남는다).
#   2026-09-28 13차 연서님 "이 순서를 임상 기본으로 굳혀 — 좌우 자 넣은 뒤엔 설정 그대로 두고 채택률만 쌓자" (v53 채택 3/4).
#   side_gap_max = 좌우 골 선 감소율 차 상한(%p). ① 메운 직후 넘으면 약한 쪽만 더 메우고(foldlift.balance_sides, 비용 0)
#     ② 재촬영 뒤에도 넘으면 'fold_asym' 으로 After 만 다시. 근거: v53 채택 3장 3·3·12%p, 제외 0001 23%p(사진 왼쪽 -44 / 오른쪽 -67).
#     0001 의 원인은 윤곽 자르기 3%(foldlift.INNER_MARGIN — 3/4 컷 먼 쪽 골이 잘렸다)였고 1.5% 로 내렸다(같은 사진 재계산 6.6%p).
#   2026-09-28 14차 연서님 v54 검수 "팔자 띠가 포토샵으로 지운 느낌 — 주변보다 하얗고 너무 깨끗해":
#     shade_pct: null = 그늘 밝히기(보조) 끔. 메우기(bna.foldlift._fill_patch)는 L·a·b 세 채널을 옆 피부 평균으로 채우고
#     결(잡티·색 얼룩·모공)은 옆 피부에서 옮겨 오며(점은 옮기지도 지우지도 않음), 메운 자리 평균 밝기는 주변 이하로 묶는다(clamp_dark).
#   band_gate = 띠 안팎 자(foldlift.band_stats — 재촬영 뒤 최종 컷을 메우기 때 찾은 같은 띠로 잰다). 넘으면 'fold_band' — After 만 다시.
#     dL_max 0 = 띠가 바로 옆 피부보다 밝으면 안 됨 · tex_min/spot_min = 띠 안 결 세기·잡티 밀도 ÷ 주변.
#     컷 근거(결 크기 0.003w): v54 최종 5장(연서님 '포토샵') 결 0.74~0.94·잡티 0.44~0.80 / Before(자연 피부) 결 0.89~1.09·잡티 0.87~1.46.
#     ⚠ 5장으로 잡은 잠정 컷이다 — 다음 회차 분포를 보고 다시 잡는다.
#   retake 는 연서님 두 벌 비교(① 재촬영 없음 / ② 재촬영 유지) 선택으로 정한다(tools/band_compare.py).
#   2026-09-28 14차 연서님 "P2 로 가자"(재촬영 유지 채택 3/5) + A: side_gate: false = 좌우 차는 탈락 사유가 아니라 기록만,
#     대신 약한(먼) 쪽을 단계적으로 더 세게 메운다(foldlift.balance_sides STRONG_STEPS). 근거: 좌우 자로 떨어진 옛 시도 0001-t2 도 채택.
#   2026-09-29 25차 연서님 "골 메우기가 입꼬리 주변에서 계속 흔들려"(24차 검수 ①멍·얼룩 ②트러블 소실 ③입술색 번짐 ④한쪽 골 끝 남음):
#     guard: true = bna.foldguard.fill_guarded(보호 마스크[입술+2px·콧볼·튀는 점]은 범위·재료 둘 다 제외·경계 앞 세기 0,
#       입꼬리 구역은 골 중심선만·재료는 볼 쪽만, 수염 자리 누르기 약하게, 팔자 3구간×좌우 기록·아래 구간 약한 쪽만 더). false 면 24차 그대로.
#     merge_lip_grow: 0.002 = 23차 합치기의 입술·입꼬리선 제외 여유를 FEAT_GROW(0.02)에서 입술 경계선만큼으로(피부 쪽 결 되돌리기).
#     근거 = 24차 5세트 재적용(tools/round25_apply.py, 새 생성 0): 입술색 번짐·입꼬리 멍이 사라지고 골 선은 -19.8~-54.5 → -24.1~-56.9%.
#   2026-09-30 빌디·연서님 "팔자 임상 마무리 — 지금 시험 스위치 조합을 임상 기본값으로 굳혀"(확인 배치 09-29 채택 2·AI 티 반려 4·자동 탈락 1):
#     retake_prompt = 재촬영 문안(22차 후보 v17, 결 참조 사진 없음 — 종전 retake_clinical.md + retake_texture_ref 경로는 지웠다).
#     retake_merge: true = 재촬영 뒤 23차 안전 합치기(texswap.merge_safe) — 종전 스위치 BNA_EXP_RETAKE / BNA_EXP_RETAKE_MERGE 는 지웠다.
#     남은 한계(고치지 않고 기록만): 잡티가 절반쯤 사라짐(47→23, 46→28) · 가끔 입꼬리·마리오네트·이마까지 같이 펴짐(82cb, 2202).
fold_fill: {enabled: true, edge_pct: -54.6, shade_pct: null, retake: true, side_gap_max: 15, side_gate: false,
            guard: true, merge_lip_grow: 0.002, retake_prompt: retake_clinical_v17.md, retake_merge: true,
            band_gate: {dL_max: 0, tex_min: 0.85, spot_min: 0.6},
            repeat_gate: {band_hit_max: 0.05, face_hit_max: 0.1}}
# repeat_gate (15차 연서님 "반복 무늬 자 추가해서 띠 안·얼굴 전체 둘 다 재고 튀면 다시") = foldlift.repeat_stats 의 '도장 조각 비율'
#   (조각이 얼굴 다른 자리와 상관 0.6 이상). 넘으면 'stamp' — After 만 다시. 근거(v56 5세트 메우기 직전 B 재메우기):
#   14차 결 옮기기 band 6.7~23%, 15차 조각 섞기 0%, Before·B·실제 사진 band 0~1.6% / face 0~6.2%.
#   ⚠ 참조 실사진 2장(lifting_*_02)은 face 25~30% — 사진 자체에 반복 영역이 있다. 문턱은 우리 생성물 기준 잠정값.

# 임상 고해상도 (2026-09-29 20차 시험 스위치 BNA_EXP_SIZE_4X5·MAX_ATTEMPTS·TIMEOUT → 09-30 임상 기본). 쓰는 곳 = batch.Batch.__init__(임상 모드만).
#   size_4x5 = 4:5 컷 크기(Before·B·재촬영 공통) · max_attempts = 한 장 5배 비용이라 3→2 · timeout = 한 콜 초(300→600).
#   되돌리기 = 이 줄 삭제(1024×1280·3회·300초). 셀카는 안 탄다.
hires: {size_4x5: "2304x2880", max_attempts: 2, timeout: 600}

# 리그 고정 (2026-09-28 6차 연서님 B "측광 리그 100%"). 있으면 rig_weights 추첨을 이긴다(추첨 rng 는 그대로 소비). 되돌리기 = 줄 삭제.
rig_fixed: clinic_wall

angles:
  front: "exact frontal view, head level, Frankfort plane horizontal"
  oblique_45: "45 degree oblique view to the left, head level"
  side: "true side profile facing left, head level"

# 다시 찍기(After) 규정 — 시점에 따라 고른다. same_day = 직후, different_day = 1주 이후.
# ⚠ '똑같이'가 아니라 '같은 부스에서 따로 찍은 사진'이다. 아래 micro_drift 가 그 살짝 다름을 요구한다.
# ⚠ 2026-09-15 저녁 연서님: "옷은 똑같은 걸 유지하되 조금씩 틀어져야" — 종전 different_day 의 '옷 다름'을 뺐다.
#   레퍼런스 ②는 옷이 달랐지만 기준은 연서님 규정이다. 옷·머리 모양은 같고, 매무새·잔머리만 틀어진다.
retake:
  same_day: >
    This is a second photo taken in the same clinic photo spot later the same day: the same backdrop,
    the same lamps in the same positions, the same camera at the same distance and height, the same
    framing, the same clothes and the same hairstyle. It is a separate exposure, not a copy of
    the reference.
  # ⚠ 2026-09-28 14차 연서님 v54 검수 "1주·2주 컷인데 옷이 같아 — 09-15 임상 규칙(직후=같은 옷·머리, 1주~=옷 다름·머리는
  #   잔머리·헤어라인만 다름)이 B 에서 안 먹고 있어" → 09-15 저녁 '옷 같음'을 1주~ 에서 되돌린다. 옷은 clothes_after 에서
  #   컷마다 추첨해 색·종류까지 적는다({clothes}, spec.build_after). 막연한 "다른 옷"은 모델이 무시한다(미모 v36~v44 와 같은 뿌리).
  different_day: >
    This is a second photo taken in the same clinic photo spot on a later visit, on another day: the
    same backdrop, the same lamps in the same positions, the same camera at the same distance and
    height, the same framing. It is another day, so the clothes are different: in this photo the
    person is wearing {clothes} - not the top from the reference photo, a different colour and a
    different garment. The hairstyle is the same (same length, colour and overall style), but on this
    day it was done again: the loose strands, flyaways and the hairline edge fall differently and,
    if the hair is tied, the tie sits a little higher or lower. It is a separate exposure, not a
    copy of the reference.

# 직후 컷 재촬영에 붙는 한 줄 (14차 연서님 A "직후 컷 재촬영에 '패치는 그대로' 한 줄"). v54 0003: 재촬영 문안의
#   "fresh … no retouching" 이 직후 흔적(투명 패치·바늘 자국)을 지워 immediate_look 2회 탈락. 쓰는 곳 = batch 재촬영(직후만).
retake_keep_marks: >
  Any small clear round patches, tape and tiny red needle dots on the skin are part of this photo and
  stay exactly where they are, with the same size, shape and shine - do not remove or fade them.

# 옷 색 자 문턱(14차): 1주~ 컷에서 전·후 옷 영역 색 차(ΔE)가 이 값 미만이면 'same_clothes' — After 만 다시.
#   근거: 옷이 실제로 같은 임상 쌍 50개(배치 814e·6462·de25·c505) ΔE 0~7.3. 검은 옷 → 검은 후디처럼 추첨이 우연히 같은 색이면
#   그것도 거른다(연서님 "색·종류까지 다르게").
clothes_gate: {dE_min: 10}

# 1주~ 옷 추첨 목록 (14차). 색 + 종류를 같이 적는다 — 흔한 병원 방문 옷차림. 추첨은 컷마다 결정적(seed·시점).
#   옷 색 비교 자(bna.qa.structure.clothes_diff, batch 'same_clothes')가 Before 와 색이 같으면 After 만 다시 그린다.

# 두 시점 공통: '살짝 다름'을 **필수**로 요구한다.
# 2026-09-15 저녁 첫 실회차 연서님 지적 3개를 항목으로 박았다 — ①잔머리 틀어짐 ②눈 뜬 정도·입 모양 ③옷 매무새.
#   종전 문장은 "살짝 다르다"고 뭉뚱그려서 모델이 전부 무시했다. 항목마다 '무엇이 어떻게' 다른지 적는다.
micro_drift: >
  This must not be a copy of the reference: it is a separate exposure and it must look like one.
  Hair: the same hairstyle, but the loose strands, flyaways and the hairline edge fall differently -
  a strand that was tucked is now loose, a wisp sits on the other side, the parting is a few
  millimetres off. Face: the eyes are open a slightly different amount, the gaze is a hair off,
  the lips rest in a slightly different way, so the fine lines around the eyes and mouth read a
  little differently while the expression stays neutral. {clothes_drift} Body: the head sits a few millimetres and a degree or two differently, the shoulders
  are not in exactly the same place.
  If the two photos overlap pixel for pixel outside the treated area, the result is wrong.
# 옷 매무새 문장은 직후(같은 옷)에만 — 1주~ 는 옷이 바뀌므로 이 줄이 있으면 "같은 옷"을 다시 시킨다(14차).
clothes_drift_same_day: >
  Clothes: the same clothes, but the collar, neckline, straps and folds sit differently - shifted,
  rumpled or straightened compared with the reference.


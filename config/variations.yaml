# 변주 축. 각 항목은 프롬프트에 삽입될 영문 구문.
# Before/After 쌍 안에서는 한 번 샘플링한 값을 그대로 공유한다.

country:
  korea: "Korean"
  japan: "Japanese"
  china: "Chinese"
  sea: "Southeast Asian"
  west: "Caucasian"

age:
  late_teens: "around 18-19 years old"
  early_20s: "in their early 20s"
  late_20s: "in their late 20s"
  30s: "in their 30s"
  40s: "in their 40s"
  50s: "in their 50s"
  60s: "in their 60s"

gender:
  female: "woman"
  male: "man"

# ── 인물 세부 축 (대량생산 시 얼굴 반복 방지의 핵심) ──
face_shape:
  oval: "oval face"
  round: "round face with soft cheeks"
  square: "square jaw, angular face"
  long: "long narrow face"
  heart: "heart-shaped face, wider forehead"

skin_tone:
  fair: "fair skin"
  light: "light skin with slight yellow undertone"
  medium: "medium skin tone"
  tan: "tan skin"
  deep: "deep skin tone"

skin_condition:
  clear: "mostly clear skin with a few small blemishes"
  freckles: "light freckles across nose and cheeks"
  moles: "a couple of small moles on the face"
  acne_marks: "faint acne scars on cheeks"
  redness: "slightly reddish cheeks"
  oily: "slightly oily T-zone"

body_type:
  slim: "slim build"
  average: "average build"
  full: "fuller face and neck"

hair_style:
  long_straight: "long straight hair"
  long_wavy: "long wavy hair"
  bob: "chin-length bob"
  short: "short hair"
  ponytail: "hair tied in a ponytail"
  bun: "hair in a loose bun"
  buzz: "very short buzz cut"
  bangs: "medium hair with bangs"

hair_color:
  black: "black hair"
  dark_brown: "dark brown hair"
  brown: "brown hair"
  light_brown: "light brown dyed hair"
  ash: "ash-toned dyed hair"
  grey: "some grey hair"

eyes:
  monolid: "monolid eyes"
  double: "double eyelids"
  hooded: "hooded eyes"
  deep_set: "deep-set eyes"

extras:
  none: ""
  glasses: "wearing thin-frame glasses"
  glasses_thick: "wearing thick black-frame glasses"
  earrings: "small earrings"
  beard_light: "light stubble"
  beard_full: "short full beard"
  mask_chin: "face mask pulled down to the chin"
  makeup_light: "light everyday makeup"
  makeup_none: "no makeup"
  tired: "slightly tired look, faint dark circles"

# 성별에 따라 제외되는 옵션
gender_exclusions:
  female: {extras: [beard_light, beard_full], hair_style: [buzz]}
  male: {extras: [makeup_light, earrings], hair_style: [long_wavy, bun, bangs, bob, long_straight, ponytail]}   # bob·long_straight 누락 → 남성 20.7% 단발/긴 생머리 (티모 0907 실측)

# 헤어 이웃: After(다른 날) 머리 모양은 2주 안에 될 수 있는 것으로만 (0909 dry-run: 포니테일 → 삭발). 없는 값은 안 바뀐다.
hair_style_neighbors:
  long_straight: [long_wavy, ponytail, bun]
  long_wavy: [long_straight, ponytail, bun]
  ponytail: [long_straight, long_wavy, bun, bob]
  bun: [long_straight, long_wavy, ponytail]
  bob: [bangs, ponytail]
  bangs: [bob]
  short: [buzz]
  buzz: []

# 맥락 × 헤어: 잔머리는 긴 머리에만 (짧은 머리에 "볼을 덮는 잔머리"가 나왔다)
context_hair:
  hair_in_face: [long_straight, long_wavy, bob, bangs, ponytail, bun]

# 나이 게이트: 그 값이 어울리는 나이에만 뽑는다 (0909 dry-run: 30대에 새치 + 굵은 목 + 피곤 = 나이가 안 읽힌다)
age_gates:
  hair_color: {grey: ["40s", "50s", "60s"]}
  extras: {tired: [late_20s, "30s", "40s", "50s", "60s"]}

background:
  clinic: "plain light clinic wall"
  home: "living room at home, slightly cluttered"
  cafe: "cafe interior, blurred"
  outdoor: "outdoor street, daytime"
  car: "inside a car, seat visible"
  bathroom: "bathroom mirror, tiles and shelf visible"
  # ── 시술 직후 After 전용 (after_immediate 로만 진입) ──
  clinic_waiting: "clinic waiting room, sofa and reception desk blurred behind"
  clinic_mirror: "mirror selfie in a clinic restroom or elevator, mirror frame visible"
  clinic_bed: "lying or sitting on a treatment bed, paper sheet and clinic curtain visible"
  car_after: "inside a car just after leaving the clinic, headrest and window visible"

angle:
  front: "straight frontal view"
  three_quarter: "three-quarter view"
  side: "side profile"
  selfie_high: "handheld selfie from slightly above, arm extended"
  selfie_low: "handheld selfie from slightly below"
  # ── 셀카 전용 (레퍼런스: 후기 사진은 정면이 드묾) ──
  selfie_3q: "handheld phone photo, face turned about 45 degrees away from the camera"
  selfie_side: "handheld phone photo, near side profile, one cheek and the jawline facing the camera"
  chin_up: "phone held below eye level, chin lifted, looking slightly down at the phone"
  tilted: "head tilted to one side, camera not level, slightly crooked horizon"

# 각도 이웃: After 는 Before 와 '비슷하되 똑같지 않은' 각도로만 이동 (로봇처럼 동일한 각도 방지)
angle_neighbors:
  front: [selfie_high, selfie_low, tilted]
  selfie_high: [front, tilted, selfie_3q]
  selfie_low: [front, chin_up, tilted]
  selfie_3q: [tilted, selfie_high, selfie_side]
  selfie_side: [selfie_3q, chin_up]
  chin_up: [selfie_low, selfie_side]
  tilted: [front, selfie_3q, selfie_high]

# 프레이밍: 화면에 얼굴이 얼마나·어디가 들어오나 (셀카 전용 축. 임상은 full_face 고정)
framing:
  full_face: "the whole face fills the frame"
  forehead_cut: "very close, forehead cut off by the top edge, chin near the bottom edge"
  lower_face: "only the lower half of the face is in frame: nose, cheeks, mouth and chin, eyes out of frame"
  one_cheek: "extreme close-up of one cheek and the side of the nose, the rest of the face outside the frame"
  nose_to_neck: "framed from the nose down to the neck and collar, mouth and jaw centered"
  neck_only: "framed from the chin down to the collarbones, the front of the neck fills the frame, face mostly out of frame"   # 목주름 필러 전용 (framing_allow 로만 진입)

# 프레이밍별 동일인 잠금 문장 (config/prompts/identity_lock*.md). 눈이 프레임 밖인 컷에 "same eyes" 를 요구하면
# 모델이 눈을 프레임 안으로 끌고 들어온다 (티모 0908 실측, Gemini B After). Before·After 중 더 좁은 쪽을 따른다.
identity_lock_by_framing:
  full_face: identity_lock.md
  forehead_cut: identity_lock.md
  lower_face: identity_lock_lower.md
  one_cheek: identity_lock_lower.md
  nose_to_neck: identity_lock_lower.md
  neck_only: identity_lock_neck.md
identity_lock_order: [full_face, forehead_cut, lower_face, one_cheek, nose_to_neck, neck_only]   # 뒤로 갈수록 좁다

# 생활 맥락: 옷·소품·머리 (셀카 전용 축. 임상은 none 고정)
context:
  none: ""
  pajamas: "wearing patterned pajamas"
  home_tee: "wearing a plain home t-shirt"
  towel_headband: "hair pushed back with a towel headband, skincare just applied"
  cap: "wearing a baseball cap, brim shadow on the forehead"
  necklace: "thin necklace visible at the collar"
  hair_in_face: "loose hair strands falling across the cheek and jaw"
  # ⚠ finger_on_cheek 은 2026-09-10 성연서님 지시로 **셀카 후보에서 뺐다**(정의만 남긴다).
  #   손을 화면에 들이는 유일한 맥락인데, 같은 프롬프트에 붙는 금지문은 "손을 프레임 밖으로"라
  #   서로를 배반했다. 실측: 0910 한국인 8세트 중 2건이 이 값으로 뽑혀 손이 나왔다.
  #   되살리려면 mode_rules.selfie.context 와 context_allow 양쪽에 같이 넣어라(한쪽만 넣으면 안 뽑힌다).
  finger_on_cheek: "one finger pressing or pointing at the cheek to show the area"
  # ── 시술 직후 After 전용 ──
  outing_top: "wearing an everyday outing top (knit, blouse or jacket), clearly not home clothes"
  clinic_headband: "hair pushed back with a clinic headband, hairline slightly messy"
  hair_flat_after: "hair flattened and messy from lying on the treatment bed, tucked behind one ear"
  # ⚠ cotton_pad 는 2026-09-10 성연서님 검수("어색한 마취크림" 5장)로 **후보에서 뺐다**(정의만 남긴다).
  #   "크림을 그리라는 말이 프롬프트에 없다"는 가설이 있었으나 실측은 반대였다 — 제외된 5장 전부
  #   after_variation.context = cotton_pad 였다(car_after 4·clinic_mirror 1). 착시가 아니라 명시 지시였다.
  #   직후 흔적은 배경(clinic_*)·머리(clinic_headband·hair_flat_after)로만 낸다.
  #   되살리려면 after_immediate.selfie.context 와 context_allow 4줄에 같이 넣어라(한쪽만이면 안 뽑힌다).
  cotton_pad: "a small cotton pad or dot of ointment still on the treated area"

lighting:
  ring: "ring light, even soft frontal light with catchlights"
  window: "natural daylight from the side"
  fluorescent: "indoor fluorescent ceiling light, slightly greenish"
  night: "dim indoor night lighting, warm lamp"
  backlit: "backlit against a bright window, face slightly underexposed"
  ceiling_harsh: "harsh overhead ceiling light, shiny oily highlights on the nose and cheekbones, uneven exposure"
  mixed: "mixed light, warm lamp on one side and cool daylight on the other, slight color cast"

color:
  neutral: "neutral color balance"
  warm: "warm tones"
  cool: "cool tones"
  iphone: "typical iPhone camera processing"
  galaxy: "typical Samsung Galaxy camera processing, slightly saturated"
  filter: "light beauty filter, subtle"

quality:
  flagship: "sharp modern flagship smartphone photo"
  mid: "mid-range phone camera, slight softness"
  old: "older smartphone, visible noise and lower dynamic range"
  front_cam: "low-resolution front camera, slight grain"
  app_upload: "phone photo re-uploaded to a review app, jpeg compression artifacts, slightly soft"

# 표정 축 (2026-09-09 신설). 팔자·리프팅·인중은 표정이 바뀌면 시술 없이도 B&A 가 된다 →
# treatments.yaml 의 expression_policy: lock 이면 Before/After 같은 값 + After 에 "identical expression" 문장.
# 표정. 2026-09-11 성연서님 지적("모든 인물의 표정이 똑같고 입 모양·위치가 다 동일해 AI 티가 난다").
#   실측 74세트: neutral_closed 51% · relaxed_open 45% · slight_smile 4% — 사실상 무표정 2종이었다.
#   ⚠ 시술 부위를 건드리지 않고 얼굴 인상을 바꾸는 곳은 **입이 아니라 눈·눈썹·시선**이다.
#     웃으면 팔자가 저절로 깊어지고 입을 오므리면 입가 주름이 생겨서, 입 쪽은 넓힐 수가 없다.
#     그래서 새 칸은 전부 '입은 그대로, 눈/시선/눈썹만 다른' 무표정 변형이다.
#   ⚠ 눈 부위 시술(눈꺼풀·눈가 필러)은 이 새 칸들을 쓰면 안 된다 — 눈을 가늘게 뜨거나 눈썹을 올리면
#     눈밑 그림자와 윗꺼풀 꺼짐이 같이 변해서 그게 시술 효과로 둔갑한다(treatments.yaml scene_allow 로 막는다).
expression:
  neutral_closed: "neutral expression, mouth closed, not smiling"
  slight_smile: "slight closed-mouth smile"
  relaxed_open: "relaxed natural expression, lips slightly parted"
  gaze_off: "neutral face, mouth closed, eyes looking slightly past the lens rather than into it"
  gaze_screen: "not posing for the camera: eyes on their own face on the screen, lips resting barely apart"
  brow_up: "mouth closed and relaxed, eyebrows lifted a little, the way people look when checking their own face"
  eyes_narrow: "mouth closed, eyes narrowed a little against the light, no smile"
  blink_soft: "caught half a second late: eyelids lowered as if mid-blink, mouth unchanged and relaxed"

# 모드별 사용 제약
mode_rules:
  clinical:
    extras: [none, glasses, glasses_thick, beard_light, beard_full, makeup_none, tired]  # 임상은 액세서리·화장 제외
    hair_style: [ponytail, bun, short, buzz]                                             # 머리 묶음 규정
    background: [clinic]
    angle: [front, three_quarter, side]
    lighting: [ring, window]
    color: [neutral]
    quality: [flagship]
    framing: [full_face]
    context: [none]
    expression: [neutral_closed]
  selfie:
    background: [home, cafe, outdoor, car, bathroom]
    # ⚠ context 화이트리스트가 없으면 전량 허용이라 "시술 직후 After 전용" 맥락 4종
    #   (outing_top·clinic_headband·hair_flat_after·cotton_pad)이 **Before** 에 붙는다.
    #   2026-09-08 실측: 400 표본 중 35.8% — cotton_pad 는 시술 전 사진에 시술 흔적이다.
    #   After 는 after_immediate 가 따로 강제하므로 여기서 빼도 직후 컷은 그대로다.
    #   회귀: selftest.py ⑥. (배경×맥락·프레이밍×맥락 표는 별건 — 리뷰 문서 §2-4)
    # finger_on_cheek 제거(2026-09-10 성연서님) — 손을 화면에 들이는 유일한 맥락이라 손 등장의 뿌리였다
    context: [none, pajamas, home_tee, towel_headband, cap, necklace, hair_in_face]
    angle: [selfie_3q, selfie_side, chin_up, tilted, selfie_high, selfie_low, front]
    lighting: [window, fluorescent, night, backlit, ceiling_harsh, mixed]   # 링라이트 제외 (스튜디오 느낌)
    color: [neutral, warm, cool, iphone, galaxy]                             # 뷰티필터 제외
    quality: [mid, old, front_cam, app_upload]                               # flagship 제외
    # ⚠ 이 줄은 화이트리스트다 — expression 축에 칸을 만들어도 여기 안 적으면 **한 번도 안 뽑힌다**
    #   (2026-09-11 실측: 새 칸 5개를 넣고 300 표본을 돌렸더니 분포가 종전 2종 그대로였다).
    expression: [neutral_closed, slight_smile, relaxed_open,
                 gaze_off, gaze_screen, brow_up, eyes_narrow, blink_soft]
  # 임상: 프레이밍·맥락은 고정

# 배경별 호환 조명 (셀카 모드). 배경을 먼저 뽑고 조명은 이 목록 안에서만 선택.
background_lighting:
  home: [window, fluorescent, night, ring, ceiling_harsh, mixed]
  cafe: [window, fluorescent, backlit, mixed]
  outdoor: [window, backlit]
  car: [window, backlit, night, mixed]
  bathroom: [fluorescent, ring, ceiling_harsh]
  clinic_waiting: [fluorescent, window, mixed]
  clinic_mirror: [fluorescent, ceiling_harsh]
  clinic_bed: [fluorescent, ceiling_harsh, ring]
  car_after: [window, backlit, mixed]

# 배경 × 맥락 허용표 (셀카). 배경을 먼저 뽑고 맥락은 이 목록 안에서만.
# 실측(0908): 배경·맥락이 독립 추첨이라 "차 안 + 수건 헤어밴드" 같은 조합이 나왔다.
context_allow:
  home:           [none, pajamas, home_tee, towel_headband, cap, necklace, hair_in_face]
  bathroom:       [none, pajamas, home_tee, towel_headband, hair_in_face]
  cafe:           [none, cap, necklace, hair_in_face, outing_top]
  outdoor:        [none, cap, necklace, hair_in_face, outing_top]
  car:            [none, cap, necklace, hair_in_face, outing_top]
  clinic_waiting: [none, outing_top, clinic_headband, hair_flat_after]
  clinic_mirror:  [none, outing_top, clinic_headband, hair_flat_after]
  clinic_bed:     [none, clinic_headband, hair_flat_after]
  car_after:      [none, outing_top, hair_flat_after]

# 프레이밍 × 맥락 금지표 (그 부위가 화면에 없으면 그 소품도 없다). 실측(0908): forehead_cut + cap = 없는 이마에 챙 그림자
framing_ban:
  forehead_cut: [cap]
  lower_face:   [cap, towel_headband, clinic_headband]
  one_cheek:    [cap, towel_headband, clinic_headband, necklace]
  nose_to_neck: [cap, towel_headband, clinic_headband]
  neck_only:    [cap, towel_headband, clinic_headband, hair_in_face, finger_on_cheek, hair_flat_after]

# 셀카 모드 After 드리프트: Before 대비 달라져도 되는 축과 확률. 이목구비는 항상 고정.
# 경과 시점(timeline)별로 다르다:
#   immediate = 시술 당일 → 같은 옷·같은 머리·같은 장소 (몇 시간 뒤). 각도·프레이밍만 조금 다름
#   1w/2w/4w  = 다른 날   → 옷·머리·배경·조명 전부 달라야 "다른 날 찍은 사진"으로 읽힘
after_drift:
  selfie:
    immediate:             # 배경·맥락은 아래 after_immediate 로 강제 교체되므로 확률 1.0
      background: 1.0
      lighting: 1.0
      angle: 0.8
      framing: 0.6
      color: 0.3
      quality: 0.3
      hair_style: 0.3
      hair_color: 0.0
      extras: 0.3
      context: 1.0
      expression: 0.5
    later:                 # 1w, 2w, 4w 공통
      background: 0.9
      lighting: 0.8
      angle: 0.7
      framing: 0.6
      color: 0.5
      quality: 0.4
      hair_style: 0.7
      hair_color: 0.15
      extras: 0.6
      context: 0.9
      expression: 0.7
  clinical: {}

# 시술 직후 After 는 "집에서 찍은 Before" 와 다른 장소·옷이어야 자연스럽다:
# 병원 대기실·거울·시술 베드·병원 나온 직후 차 안, 외출복 또는 시술용 헤어밴드.
after_immediate:
  selfie:
    background: [clinic_waiting, clinic_mirror, clinic_bed, car_after]
    context: [outing_top, clinic_headband, hair_flat_after]   # cotton_pad 제외(0910 성연서님 "어색한 마취크림")
    extras: [none, glasses, glasses_thick, mask_chin, tired]   # 같은 날 생길 수 있는 것만 (0909 dry-run: 직후 컷에 수염이 생겼다)

# 축 가중치 (균형 샘플링 시 옵션별 등장 비율). 미지정 옵션은 1.
# 실제 고객층 반영: 한국 여성 비중 확대.
weights:
  country: {korea: 5, japan: 1, china: 1, sea: 1, west: 1}       # 한국 ≈ 55%
  gender: {female: 3, male: 1}                                   # 여성 75%
  age: {late_teens: 1, early_20s: 2, late_20s: 3, "30s": 3, "40s": 3, "50s": 2, "60s": 1}
  # 셀카: 정면은 드물게, 부분 크롭 우세 (레퍼런스 후기 사진 비율 반영)
  angle: {front: 1, selfie_high: 1, selfie_low: 1, selfie_3q: 3, selfie_side: 2, chin_up: 2, tilted: 2}
  # 프레이밍 (2026-09-11 성연서님 B안 "눈 안 보이는 컷은 계속 쓰되 비중을 줄인다", 목표 못 잼 10% 미만).
  # 가중은 취향이 아니라 **프레이밍별 실측 못 잼률**에서 나왔다 —
  #   한쪽 볼 7/7(100%) · 목만 3/4(75%) · 아래 얼굴 4/8(50%) · 코~목 1/8(12.5%) · 이마 잘림 0/11 · 얼굴 전체 0/8.
  # 눈이 프레임 밖이면 얼굴 검출기가 시작을 못 한다(그림이 나빠서가 아니다) → 그 컷이 많을수록 게이트가 조용히 꺼진다.
  # ⚠ 빼지 않고 낮추기만 한다. 리얼리티(초근접 후기 사진 느낌)를 버리지 않으려는 것이고,
  #   0 으로 죽이면 모델이 나중에 좋아졌는지 확인할 길이 사라진다.
  # ⚠ forehead_cut 을 제일 높였다 — '아주 가까운 셀카'인데 눈이 프레임 안이라, 리얼리티와 검사 가능성을 동시에 만족하는 유일한 칸이다.
  # ⚠ 최소 1 rep 이라 실효 하한은 0.25 다(planner.WEIGHT_SCALE=4). 더 줄이려면 framing_allow 에서 빼라.
  # 재계산·검증 = tools/framing_na_forecast.py (실측률을 원장에서 다시 읽어 예상 못 잼을 낸다)
  framing: {full_face: 3, forehead_cut: 6, lower_face: 0.5, one_cheek: 0.25, nose_to_neck: 1.5, neck_only: 0.25}
  # 상담용 사진은 대부분 무표정이다 — 무표정을 줄이는 게 아니라 **무표정의 결을 늘린다**(2026-09-11).
  # 합이 무표정 계열 13 : 미소 1 이라 "상담 사진 같음"은 그대로고, 같은 얼굴이 반복되는 느낌만 흩어진다.
  expression: {neutral_closed: 3, slight_smile: 1, relaxed_open: 2,
               gaze_off: 2, gaze_screen: 2, brow_up: 1.5, eyes_narrow: 1.5, blink_soft: 1}


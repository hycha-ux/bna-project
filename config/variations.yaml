# 변주 축. 각 항목은 프롬프트에 삽입될 영문 구문.
# Before/After 쌍 안에서는 한 번 샘플링한 값을 그대로 공유한다.

country:
  korea: "Korean"
  japan: "Japanese"
  china: "Chinese"
  sea: "Southeast Asian"
  west: "Caucasian"

age:
  late_teens: "around 18-19 years old"
  early_20s: "in their early 20s"
  late_20s: "in their late 20s"
  30s: "in their 30s"
  40s: "in their 40s"
  50s: "in their 50s"
  60s: "in their 60s"

gender:
  female: "woman"
  male: "man"

# ── 인물 세부 축 (대량생산 시 얼굴 반복 방지의 핵심) ──
face_shape:
  oval: "oval face"
  round: "round face with soft cheeks"
  square: "square jaw, angular face"
  long: "long narrow face"
  heart: "heart-shaped face, wider forehead"

skin_tone:
  fair: "fair skin"
  light: "light skin with slight yellow undertone"
  medium: "medium skin tone"
  tan: "tan skin"
  deep: "deep skin tone"

skin_condition:
  clear: "mostly clear skin with a few small blemishes"
  freckles: "light freckles across nose and cheeks"
  moles: "a couple of small moles on the face"
  acne_marks: "faint acne scars on cheeks"
  redness: "slightly reddish cheeks"
  oily: "slightly oily T-zone"

body_type:
  slim: "slim build"
  average: "average build"
  full: "fuller face and neck"

hair_style:
  long_straight: "long straight hair"
  long_wavy: "long wavy hair"
  bob: "chin-length bob"
  short: "short hair"
  ponytail: "hair tied in a ponytail"
  bun: "hair in a loose bun"
  buzz: "very short buzz cut"
  bangs: "medium hair with bangs"

hair_color:
  black: "black hair"
  dark_brown: "dark brown hair"
  brown: "brown hair"
  light_brown: "light brown dyed hair"
  ash: "ash-toned dyed hair"
  grey: "some grey hair"

eyes:
  monolid: "monolid eyes"
  double: "double eyelids"
  hooded: "hooded eyes"
  deep_set: "deep-set eyes"

# 미모 (2026-09-17 연서님 "미모도 프롬프트 축으로" — 09-16 회의 "미모 셀카형이 6:4 정도로 섞여 노출되게").
#   ordinary 는 빈 문장이다 — 종전 프롬프트가 글자 하나 안 바뀐다(기존 회차와 비교가 끊기지 않는다). attractive 만 문장을 얹는다.
#   ⚠ 이 축은 '예쁘게 그려라'가 아니라 **원래 그렇게 생긴 사람**이다 — 피부·주름·리얼리티 규정은 그대로 다 붙는다.
#     Before 의 "described 보다 더 예쁘게 만들지 마라"와 충돌하지 않는 이유: 여기 적힌 것까지가 'described' 다.
#   임상은 ordinary 고정(mode_rules) — 병원 기록 사진은 미모를 고르지 않는다. 6:4 는 셀카 가중(weights.looks).
#   2026-09-21 연서님 "미모가 나온 적이 없다" — 09-17 문장은 사람 묘사 맨 끝에 붙고 절반이 부정문("모델 아님·이상화 아님")이라
#     Before 의 "described 보다 예쁘게 마라"·동일인 잠금·회피 규칙(대칭 금지) 셋에 눌려 보통 얼굴로 수렴했다(실측 미모 15장 중 미모로 읽힌 컷 0).
#     그래서 ① 문장을 인물 **맨 앞** 형용사로("strikingly pretty Korean woman…") ② 부정문 대신 구체 특징(looks_detail) ③ 나이는 20~30대만(looks_gates.age).
#   looks = 인물 앞 형용사 한 마디. looks_detail = 나이 뒤에 붙는 구체 특징 문장. 둘 다 spec.person_description 이 조립한다.
looks:
  ordinary: ""
  attractive: "strikingly pretty"
looks_detail:
  ordinary: ""
  attractive: "with clear bright eyes, smooth even facial contours, a neat jawline and balanced proportions - the kind of face that gets compliments"

extras:
  none: ""
  glasses: "wearing thin-frame glasses"
  glasses_thick: "wearing thick black-frame glasses"
  earrings: "small earrings"
  beard_light: "light stubble"
  beard_full: "short full beard"
  mask_chin: "face mask pulled down to the chin"
  makeup_light: "light everyday makeup"
  makeup_none: "no makeup"
  tired: "slightly tired look, faint dark circles"

# 성별에 따라 제외되는 옵션
gender_exclusions:
  female: {extras: [beard_light, beard_full], hair_style: [buzz]}
  male: {extras: [makeup_light, earrings], hair_style: [long_wavy, bun, bangs, bob, long_straight, ponytail]}   # bob·long_straight 누락 → 남성 20.7% 단발/긴 생머리 (티모 0907 실측)

# 헤어 이웃: After(다른 날) 머리 모양은 2주 안에 될 수 있는 것으로만 (0909 dry-run: 포니테일 → 삭발). 없는 값은 안 바뀐다.
hair_style_neighbors:
  long_straight: [long_wavy, ponytail, bun]
  long_wavy: [long_straight, ponytail, bun]
  ponytail: [long_straight, long_wavy, bun, bob]
  bun: [long_straight, long_wavy, ponytail]
  bob: [bangs, ponytail]
  bangs: [bob]
  short: [buzz]
  buzz: []

# 맥락 × 헤어: 잔머리는 긴 머리에만 (짧은 머리에 "볼을 덮는 잔머리"가 나왔다)
context_hair:
  hair_in_face: [long_straight, long_wavy, bob, bangs, ponytail, bun]

# 나이 게이트: 그 값이 어울리는 나이에만 뽑는다 (0909 dry-run: 30대에 새치 + 굵은 목 + 피곤 = 나이가 안 읽힌다)
age_gates:
  hair_color: {grey: ["40s", "50s", "60s"]}
  extras: {tired: [late_20s, "30s", "40s", "50s", "60s"]}

# 미모 게이트: 그 값은 적힌 looks 에서만 뽑힌다 (2026-09-17 성연서님 "노션 AI 셀카를 베이스로" 1단계).
#   노션 셀카 30세트의 장면(창가 카페·노을 테라스·공원·니트/흰 셔츠/검은 상의·늦은 오후 햇빛)은 '미모 셀카' 분위기라
#   보통 인물에 붙으면 인플루언서 사진이 된다. 판정 = spec.allowed_values 의 looks_gates 한 곳.
#   ⚠ 새 값은 mode_rules.selfie(화이트리스트)·background_lighting·context_allow 에도 같이 들어가야 뽑힌다 — 한 곳만 넣으면 조용히 0.
looks_gates:
  # 나이: 미모 인물은 20~30대만 (2026-09-21 연서님). 40대~는 보통 인물에서만 뽑힌다 — 그래서 planner/spec 은 looks 를 age 보다 먼저 뽑는다(DRAW_ORDER).
  age: {late_teens: [ordinary], "40s": [ordinary], "50s": [ordinary], "60s": [ordinary]}
  background: {cafe_window: [attractive], terrace_golden: [attractive], park_green: [attractive]}
  context: {knit_cardigan: [attractive], white_blouse: [attractive], fitted_black_top: [attractive]}
  lighting: {golden_hour: [attractive]}

# 미모 프로필 (2026-09-21 빌디 제안·연서님 확인 "한 줄씩 열지 말고 미모 프로필로 한 번에 묶어 2세트 시험") —
#   **실험 스위치 BNA_EXP_LOOKS_PROFILE=1 일 때만** 먹는다(spec.looks_profile 한 곳이 판정). 정식 경로는 종전 그대로.
#   왜 묶었나: 미모 컷은 "strikingly pretty" 한 줄 뒤에 리얼리티 규칙(솔직한 나이·피곤·잡티·무보정·주름 뚜렷)이
#   다섯 줄 붙어 리얼리티가 이겼다 — v31 에서 빛(golden_hour)만 열어도 얼굴은 '평범한 30대'였다(노션 비교 시트).
#   ① 피부·피곤 계열 빼기(gates·skin_text) — 모공·솜털 질감 문장은 남긴다(AI 티 방지, skin_texture)
#   ② 자연 메이크업(makeup) ③ 긴 생머리·머리~바스트 가중(weights) ④ Before 강도 mild 고정·late_20s 중심
#   ⑤ 노션 AI 셀카 얼굴 컷을 '외모 수준' 참조로 붙인다(face_refs — refs.face_ref 가 고른다, 얼굴은 베끼지 않게 문장으로 막는다)
#   ⚠ 끄기 = 스위치를 안 켜면 끝(이 블록은 스위치 없이는 아무것도 안 한다).
#   ── 2차(같은 날 연서님: "④ moderate OK · 참조를 더 세게 · 한국 고정 · 미모 안경 제외 · 한국적 미인상") ──
#   v32 1차 결과: 얼굴은 노션 쪽으로 왔지만 mild 라 효과 점수 3·4점으로 0/2 탈락, 참조 닮음 0.13·0.20(거의 안 봄).
#   ④ mild → 미모 전용 moderate 문장(before_condition — 주름은 또렷, "솔직한 나이·더 예쁘게 금지"는 뺌).
#     ⚠ 팔자 severity_min_age 가 moderate=30s 라 late_20s 는 여전히 mild 로 내려간다 — 그래서 late_20s 가중을 뺐다.
#   ⑤ 참조 face_refs 장(기본 3)·문장은 "다른 사람이되 같은 미인상", 참조와 닮음 face_sim_max 초과면 Before 다시(batch).
#   한국적 미인상 = detail_by_country(그 나라일 때만 — 다른 나라 인물에 '한국적'을 붙이지 않는다) + 피부톤·얼굴형·머리 게이트.
looks_profile:
  attractive:
    # 정식 반영(2026-09-21 연서님 "①~③ OK") — 스위치 없이 켜진다. 되돌리기 = false.
    #   근거: 프로필 2·3차 사람 채택 2/4(전체 평균 약 49%와 같음), 얼굴은 노션 미인상 도달. ⚠ 4장이라 '안 나빠졌다'까지만.
    #   강제로 끄고 비교할 땐 환경변수 BNA_EXP_LOOKS_PROFILE=0.
    enabled: true
    treatments: [nasolabial]     # 시험한 시술만 — 전역으로 켜자 피부 3종 조명 호·표정 정책이 깨졌다(spec.looks_profile)
    # ④ 같은 날: 프로필 회차에서 사람이 뺀 2장이 전부 '효과 없음'(둘 다 기계 통과) → After 에 한 줄(spec.build_after).
    after_note: >
      Side by side with the reference, the softer nasolabial folds and marionette lines must be obvious at a glance,
      even with the same slight smile and the same side light.
    weights: {hair_style: {long_straight: 4}, framing: {head_to_bust: 4}}
    # 2차 dry 에서 본 모순 둘을 같이 막았다: '작은 얼굴' + body_type full("fuller face and neck"), '맑은 피부' + 주근깨·점
    # 구도 게이트(2026-09-22 빌디 "미모 컷은 크롭이면 안 된다 — 노션 30장 전부 얼굴 전체~상반신"):
    #   가중(weights.framing)만으론 v35 0001 이 lower_face 로 나갔다. After 이웃 이동도 이 게이트를 거쳐
    #   full_face→forehead_cut 이 막힌다(drift_after 의 allowed_values). 되돌리기 = framing 한 칸 삭제.
    gates: {framing: [full_face, head_to_bust], skin_condition: [clear], extras: [none, earrings], body_type: [slim, average],
            skin_tone: [fair, light], face_shape: [oval, heart], hair_style: [long_straight]}
    skin_text: {clear: "clear, even skin"}
    # 09-22 연서님: "see-through bangs" 가 앞머리를 눈 위로 내렸다(v37 0001 채택 컷 Before 포함) →
    #   "눈썹 위·두 눈 완전 노출"로 교체. 눈 가림은 qa_checklist `eyes_uncovered` 게이트가 따로 거른다.
    hair_text: {long_straight: "long straight hair with short light bangs cut above the eyebrows; no strand falls over the eyebrows, eyelids or eyes, and both eyes are fully visible"}
    detail_by_country:
      korea: "with a classic Korean beauty look: fair, clear, luminous skin, a small face, clearly defined bright eyes and full lips"
    makeup: "natural makeup: soft mascara, a thin line of eyeliner and a tinted lip"
    severity: moderate
    before_condition:
      nasolabial:
        moderate: >
          This person has never had any aesthetic treatment. Even on this pretty, well-kept face, clearly
          visible nasolabial folds run from the sides of the nose to just above and outside the corners of
          the mouth with a light shadow in the crease, and a shallow marionette line runs from each corner
          of the mouth down and slightly outward toward the jawline. The makeup does not hide these lines,
          and the slight smile and the side light make them read clearly. Do not soften or hide these lines.
    face_sim_max: 0.6
    # ── 3차(같은 날 연서님: "미모 컷은 정면 부드러운 빛이라 Before 에 팔자가 원래 안 보여. 옆빛·살짝 웃는 표정으로") ──
    #   v33 0000 은 moderate 인데도 효과 3점 — Before 사진에 주름이 거의 안 보였다(없던 걸 고칠 수는 없다).
    #   before_force = Before 추첨에서 이 값만 허용(시술 scene_allow 를 **일부러 넘는다** — 팔자는 웃음을 막아 둔 축이다).
    #   ⚠ 그래서 lock_after 가 한 벌이다: 웃는 Before 에 안 웃는 After 가 오면 시술 없이 팔자가 얕아진다 = 가짜 효과.
    #     표정·빛 둘 다 After 에서 잠그고, After 문장도 "같은 웃음 그대로"로 바꾼다(spec.build_prompts 의 smile_held).
    #   욕실·병원 배경은 옆빛을 못 낸다(background_lighting) → 미모에서 뺀다.
    before_force: {expression: [slight_smile], lighting: [window, golden_hour]}
    lock_after: [expression, lighting]
    # 09-22 연서님 "각도 한 칸 풀어서" — v36 복붙 4/6. 이웃 한 칸만(angle_neighbors), 되돌리기 = 이 줄 삭제.
    after_relax: [angle]
    gates_bg: [cafe_window, terrace_golden, park_green, cafe, outdoor, home, car]
    skin_texture: "Real skin with visible pores up close, faint peach fuzz and natural asymmetry; individual hair strands."
    skin_read: >
      The skin reads clear and even in this light, with real texture still visible; a natural, healthy
      look as it is on a good day - no beauty filter, no smoothing, no glass-skin sheen.
    face_refs: 3

background:
  clinic: "plain light clinic wall"
  home: "living room at home, slightly cluttered"
  cafe: "cafe interior, blurred"
  outdoor: "outdoor street, daytime"
  car: "inside a car, seat visible"
  bathroom: "bathroom mirror, tiles and shelf visible"
  # ── 미모 셀카 전용 (looks_gates) — 2026-09-17 성연서님 노션 'AI' 토글 셀카 30세트에서 뽑은 장면 ──
  #   얼굴이 아니라 **장면만** 빌린다(docs/notion-ai-selfie-refs-0917.md, teemo 리포). 30세트 배경 실측:
  #   카페(창가·원목·조명) 다수 · 노을 무렵 테라스/루프톱 · 나무·꽃 있는 야외 · 차 안.
  cafe_window: "seat by a large cafe window, warm wood interior and pendant lights softly blurred behind"
  terrace_golden: "outdoor cafe terrace or rooftop in the late afternoon, city buildings softly blurred behind"
  park_green: "outdoor path with trees and a few flowers, soft green bokeh behind"
  # ── 시술 직후 After 전용 (after_immediate 로만 진입) ──
  clinic_waiting: "clinic waiting room, sofa and reception desk blurred behind"
  clinic_mirror: "mirror selfie in a clinic restroom or elevator, mirror frame visible"
  clinic_bed: "lying or sitting on a treatment bed, paper sheet and clinic curtain visible"
  car_after: "inside a car just after leaving the clinic, headrest and window visible"

angle:
  front: "straight frontal view"
  three_quarter: "three-quarter view"
  side: "side profile"
  selfie_high: "handheld selfie from slightly above, arm extended"
  selfie_low: "handheld selfie from slightly below"
  # ── 셀카 전용 (레퍼런스: 후기 사진은 정면이 드묾) ──
  selfie_3q: "handheld phone photo, face turned about 45 degrees away from the camera"
  selfie_side: "handheld phone photo, near side profile, one cheek and the jawline facing the camera"
  chin_up: "phone held below eye level, chin lifted, looking slightly down at the phone"
  tilted: "head tilted to one side, camera not level, slightly crooked horizon"

# 각도 이웃: After 는 Before 와 '비슷하되 똑같지 않은' 각도로만 이동 (로봇처럼 동일한 각도 방지)
angle_neighbors:
  front: [selfie_high, selfie_low, tilted]
  selfie_high: [front, tilted, selfie_3q]
  selfie_low: [front, chin_up, tilted]
  selfie_3q: [tilted, selfie_high, selfie_side]
  selfie_side: [selfie_3q, chin_up]
  chin_up: [selfie_low, selfie_side]
  tilted: [front, selfie_3q, selfie_high]

# 프레이밍: 화면에 얼굴이 얼마나·어디가 들어오나 (셀카 전용 축. 임상은 full_face 고정)
framing:
  # 머리~바스트 (2026-09-17 연서님 "클로즈업 말고 전체 셀카도" — 09-16 회의 "전신 아님, 머리부터 바스트까지 셀카 형태").
  #   얼굴이 작아지므로 동일인 게이트·효과 판정 정확도가 떨어질 수 있다 → 09-16 합의대로 **소량 먼저 재본다**(가중 2).
  #   손·폰은 여전히 화면 밖(09-10 기준) — 폰 든 팔이 화면 밖으로 빠지는 팔 길이 셀카다. 팔자만 허용(framing_allow).
  head_to_bust: "an arm's-length selfie framed from the top of the head down to the upper chest, shoulders in the frame, the face in the upper middle of the picture with room around it"
  full_face: "the whole face fills the frame"
  forehead_cut: "very close, forehead cut off by the top edge, chin near the bottom edge"
  lower_face: "only the lower half of the face is in frame: nose, cheeks, mouth and chin, eyes out of frame"
  one_cheek: "extreme close-up of one cheek and the side of the nose, the rest of the face outside the frame"
  nose_to_neck: "framed from the nose down to the neck and collar, mouth and jaw centered"
  neck_only: "framed from the chin down to the collarbones, the front of the neck fills the frame, face mostly out of frame"   # 목주름 필러 전용 (framing_allow 로만 진입)

# 프레이밍별 동일인 잠금 문장 (config/prompts/identity_lock*.md). 눈이 프레임 밖인 컷에 "same eyes" 를 요구하면
# 모델이 눈을 프레임 안으로 끌고 들어온다 (티모 0908 실측, Gemini B After). Before·After 중 더 좁은 쪽을 따른다.
identity_lock_by_framing:
  head_to_bust: identity_lock.md
  full_face: identity_lock.md
  forehead_cut: identity_lock.md
  lower_face: identity_lock_lower.md
  one_cheek: identity_lock_lower.md
  nose_to_neck: identity_lock_lower.md
  neck_only: identity_lock_neck.md
identity_lock_order: [head_to_bust, full_face, forehead_cut, lower_face, one_cheek, nose_to_neck, neck_only]   # 뒤로 갈수록 좁다

# 프레이밍 이웃표 (2026-09-14). After 프레이밍이 바뀔 때 **한 칸 옆 거리로만** 옮긴다.
# 각도(angle_neighbors)·머리(hair_style_neighbors)와 같은 방식이고 이유도 같다: 자유 재추첨은
#   '전=얼굴 전체 → 후=한쪽 볼' 같은 점프를 만들어 전후 비교 자체를 깨고(0911 시리즈 사고),
#   완전 잠금은 여섯 장이 복붙처럼 보이게 한다(0914 연서님 검수).
# ⚠ 이 표는 '거리'로 읽어라 — 목만 컷은 옮기면 시술 부위가 통째로 사라지므로 이웃이 없다.
# ⚠ 시리즈 컷은 종전대로 완전 잠금이다(spec.SERIES_LOCK) — 같은 사람의 여러 시점은 같은 구도여야 한다.
# ⚠ 2026-09-14 오후 (연서님 검수, 0914 모공 배치 0001): 이웃을 **눈이 있는 칸끼리 / 없는 칸끼리**로
#   갈랐다. `forehead_cut → lower_face` 는 표상 한 칸이지만 그림에서는 **눈이 사라지는 한 칸**이라,
#   전=얼굴 위쪽·후=턱 클로즈업이 되어 ①사람이 같은 사람인지 대조할 수가 없고 ②동일인 게이트도
#   얼굴 검출이 안 돼 조용히 꺼진다. 거리만 재고 '무엇이 화면에서 없어지는지'를 안 본 표였다.
#   확대 컷 비중은 그대로다 — 전이 확대면 후도 확대 안에서 움직인다(그룹 안 이동은 계속 열려 있다).
framing_neighbors:
  head_to_bust: [full_face]          # 눈 있음 그룹 — 바스트 ↔ 얼굴 전체는 한 칸(둘 다 눈·얼굴 전체가 있다)
  full_face: [forehead_cut, head_to_bust]
  forehead_cut: [full_face]
  lower_face: [one_cheek, nose_to_neck]   # 눈 없음 그룹
  one_cheek: [lower_face]
  nose_to_neck: [lower_face]
  neck_only: []

# 생활 맥락: 옷·소품·머리 (셀카 전용 축. 임상은 none 고정)
context:
  none: ""
  pajamas: "wearing patterned pajamas"
  home_tee: "wearing a plain home t-shirt"
  towel_headband: "hair pushed back with a towel headband, skincare just applied"
  cap: "wearing a baseball cap, brim shadow on the forehead"
  necklace: "thin necklace visible at the collar"
  hair_in_face: "loose hair strands falling across the cheek and jaw"
  # ⚠ finger_on_cheek 은 2026-09-10 성연서님 지시로 **셀카 후보에서 뺐다**(정의만 남긴다).
  #   손을 화면에 들이는 유일한 맥락인데, 같은 프롬프트에 붙는 금지문은 "손을 프레임 밖으로"라
  #   서로를 배반했다. 실측: 0910 한국인 8세트 중 2건이 이 값으로 뽑혀 손이 나왔다.
  #   되살리려면 mode_rules.selfie.context 와 context_allow 양쪽에 같이 넣어라(한쪽만 넣으면 안 뽑힌다).
  finger_on_cheek: "one finger pressing or pointing at the cheek to show the area"
  # ── 시술 직후 After 전용 ──
  outing_top: "wearing an everyday outing top (knit, blouse or jacket), clearly not home clothes"
  clinic_headband: "hair pushed back with a clinic headband, hairline slightly messy"
  hair_flat_after: "hair flattened and messy from lying on the treatment bed, tucked behind one ear"
  # ⚠ cotton_pad 는 2026-09-10 성연서님 검수("어색한 마취크림" 5장)로 **후보에서 뺐다**(정의만 남긴다).
  #   "크림을 그리라는 말이 프롬프트에 없다"는 가설이 있었으나 실측은 반대였다 — 제외된 5장 전부
  #   after_variation.context = cotton_pad 였다(car_after 4·clinic_mirror 1). 착시가 아니라 명시 지시였다.
  #   직후 흔적은 배경(clinic_*)·머리(clinic_headband·hair_flat_after)로만 낸다.
  #   되살리려면 after_immediate.selfie.context 와 context_allow 4줄에 같이 넣어라(한쪽만이면 안 뽑힌다).
  cotton_pad: "a small cotton pad or dot of ointment still on the treated area"
  # ── 미모 셀카 전용 옷 (looks_gates, 2026-09-17 노션 AI 셀카 30세트 실측: 크림 니트 가디건·흰 셔츠·검은 슬림 상의가 대부분) ──
  knit_cardigan: "wearing a soft cream knit cardigan over a plain top"
  white_blouse: "wearing a simple white cotton blouse, collar open"
  fitted_black_top: "wearing a fitted plain black top with a thin necklace"

lighting:
  ring: "ring light, even soft frontal light with catchlights"
  window: "natural daylight from the side"
  fluorescent: "indoor fluorescent ceiling light, slightly greenish"
  night: "dim indoor night lighting, warm lamp"
  backlit: "backlit against a bright window, face slightly underexposed"
  ceiling_harsh: "harsh overhead ceiling light, shiny oily highlights on the nose and cheekbones, uneven exposure"
  mixed: "mixed light, warm lamp on one side and cool daylight on the other, slight color cast"
  # ── 2026-09-14 피부 3종 조명 호(lighting_arc) 전용으로 신설 (연서님 검수: "실제 전은 센 빛에
  #   모공이 그림자로 파이고, 후는 부드러운 빛에 하이라이트(물광)"). 다른 시술도 쓸 수 있게 전역 축에 둔다.
  #   ⚠ 둘은 짝이다 — flash 만 넣고 window_soft 를 빼면 '전보다 나빠 보이는 후'가 나온다.
  flash: "direct phone flash in a dim room, hard flat frontal light, sharp shadow outline behind the head, shiny oily highlights, every pore and flake raised by the light"
  window_soft: "soft diffused daylight through a curtain, gentle even light with a smooth sheen on the cheekbones, no hard shadows"
  # 미모 셀카 전용 (looks_gates, 2026-09-17 노션 AI 셀카 — 늦은 오후 옆빛이 가장 흔했다). ⚠ 팔자 scene_allow 엔 없어 팔자엔 안 붙는다
  golden_hour: "warm late-afternoon sunlight from one side, a soft glow along the hair and cheek"

color:
  neutral: "neutral color balance"
  warm: "warm tones"
  cool: "cool tones"
  iphone: "typical iPhone camera processing"
  galaxy: "typical Samsung Galaxy camera processing, slightly saturated"
  filter: "light beauty filter, subtle"

quality:
  flagship: "sharp modern flagship smartphone photo"
  mid: "mid-range phone camera, slight softness"
  old: "older smartphone, visible noise and lower dynamic range"
  front_cam: "low-resolution front camera, slight grain"
  app_upload: "phone photo re-uploaded through a chat app, jpeg compression artifacts, slightly soft"

# 표정 축 (2026-09-09 신설). 팔자·리프팅·인중은 표정이 바뀌면 시술 없이도 B&A 가 된다 →
# treatments.yaml 의 expression_policy: lock 이면 Before/After 같은 값 + After 에 "identical expression" 문장.
# 표정. 2026-09-11 성연서님 지적("모든 인물의 표정이 똑같고 입 모양·위치가 다 동일해 AI 티가 난다").
#   실측 74세트: neutral_closed 51% · relaxed_open 45% · slight_smile 4% — 사실상 무표정 2종이었다.
#   ⚠ 시술 부위를 건드리지 않고 얼굴 인상을 바꾸는 곳은 **입이 아니라 눈·눈썹·시선**이다.
#     웃으면 팔자가 저절로 깊어지고 입을 오므리면 입가 주름이 생겨서, 입 쪽은 넓힐 수가 없다.
#     그래서 새 칸은 전부 '입은 그대로, 눈/시선/눈썹만 다른' 무표정 변형이다.
#   ⚠ 눈 부위 시술(눈꺼풀·눈가 필러)은 이 새 칸들을 쓰면 안 된다 — 눈을 가늘게 뜨거나 눈썹을 올리면
#     눈밑 그림자와 윗꺼풀 꺼짐이 같이 변해서 그게 시술 효과로 둔갑한다(treatments.yaml scene_allow 로 막는다).
expression:
  neutral_closed: "neutral expression, mouth closed, not smiling"
  slight_smile: "slight closed-mouth smile"
  relaxed_open: "relaxed natural expression, lips slightly parted"
  gaze_off: "neutral face, mouth closed, eyes looking slightly past the lens rather than into it"
  gaze_screen: "not posing for the camera: eyes on their own face on the screen, lips resting barely apart"
  brow_up: "mouth closed and relaxed, eyebrows lifted a little, the way people look when checking their own face"
  eyes_narrow: "mouth closed, eyes narrowed a little against the light, no smile"
  blink_soft: "caught half a second late: eyelids lowered as if mid-blink, mouth unchanged and relaxed"
  # ── 입 모양 변주 (2026-09-11 성연서님 "입모양이 너무 똑같은 모양이야 로봇처럼") ──
  # 09-11 오전에 표정 칸을 3→8종으로 늘렸는데 **늘린 5칸이 전부 눈·눈썹만 바꿨다** — 실측 400표본에서
  # 입 상태는 여전히 2종이고 74%가 같은 '다문 채'였다. 축 이름이 expression 이라 늘린 줄 알았지, 정작
  # 사람 눈에 제일 먼저 띄는 입은 한 칸도 안 늘었다. 아래 3칸은 *입이 실제로 다른* 칸이다.
  # ⚠ 웃음은 여전히 금지다 — 웃으면 팔자가 저절로 깊어져 시술 효과로 둔갑한다. 여기 있는 건
  #   '웃지 않으면서 입이 다른' 모양뿐이고, 입꼬리를 *올리는* 방향은 하나도 없다.
  jaw_loose: "not smiling: the lips stay together but the jaw hangs loose, so the chin sits a little lower and the mouth line is longer than in a held pose"
  lips_speak: "caught mid-word: the mouth is open a little with the lower lip dropped and the upper teeth just visible, not a smile"
  lip_asym: "resting face, lips closed but not symmetric - one corner sits a touch lower than the other, no smile"

# 표정 칸을 '사람 눈에 보이는 상태'로 묶은 표 (2026-09-14 밤).
# ⚠ 이 표는 **확률을 올리는 대신** 넣은 것이다 — 연서님 "표정 다르게 뽑기를 '무조건'이라는 단어로
#   너무 막아두지 말자". 잠그면(확률 1.0) 전후가 늘 다른 표정이라 그것대로 기계 같아진다.
# 근거(실측 450세트, tools/_probe_expr_0914.py): 표정 **키**는 69% 바뀌는데, 그중 상당수가
#   neutral_closed → slight_smile 처럼 *입도 다물고 눈도 렌즈를 보는* 이웃이라
#   **입·눈이 둘 다 그대로인 세트가 47%** 였다. 연서님이 본 "입 벌림·눈 뜬 정도가 딱 같다"가 이것이다.
#   → 확률은 0.7 그대로 두고(30%는 여전히 같은 표정), *바뀔 때는* 입이나 눈 중 하나가 실제로 다른
#     칸을 고른다. 고를 게 없으면 종전대로 아무 칸이나 고른다(fail-open — 막지 않는다).
# ⚠ mouth 는 '모양'이 아니라 **벌림**이다(closed/open). jaw_loose·lip_asym 은 입 모양이 다르지만
#   벌림은 같아서 closed 로 둔다 — 연서님이 지적한 축이 '입 벌림 정도'라 그 축으로 잰다.
# ⚠ expression 에 칸을 새로 만들면 여기에도 한 줄 추가해라. 빠진 칸은 '상태 미상'이라
#   이웃 회피가 안 걸린다(조용히 옛 동작으로 돌아간다). 회귀 ㉜-① 이 누락을 잡는다.
expression_traits:
  neutral_closed: {mouth: closed, eyes: lens}
  slight_smile:   {mouth: closed, eyes: lens}
  relaxed_open:   {mouth: open,   eyes: lens}
  gaze_off:       {mouth: closed, eyes: away}
  gaze_screen:    {mouth: open,   eyes: away}
  brow_up:        {mouth: closed, eyes: brow}
  eyes_narrow:    {mouth: closed, eyes: narrow}
  blink_soft:     {mouth: closed, eyes: lowered}
  jaw_loose:      {mouth: closed, eyes: lens}   # 입은 다문 채다 — 턱만 내려온다(입 '벌림'은 같다)
  lips_speak:     {mouth: open,   eyes: lens}
  lip_asym:       {mouth: closed, eyes: lens}   # 입꼬리 비대칭도 '다문 입'이다

# 모드별 사용 제약
mode_rules:
  clinical:
    country: [korea]      # 임상은 한국인만 (2026-09-15 저녁 연서님: "동양인 한국인만 보였으면"). 셀카는 전역 가중(한국 55%) 그대로
    extras: [none, beard_light, beard_full, makeup_none, tired]  # 임상은 액세서리·화장 제외. 안경도 뺌 — 촬영 때 벗기고 찍는다 (2026-09-15 연서님)
    hair_style: [ponytail, bun, short, buzz]                                             # 머리 묶음 규정
    background: [clinic]
    angle: [front, three_quarter, side]
    lighting: [ring, window]
    color: [neutral]
    quality: [flagship]
    framing: [full_face]
    context: [none]
    expression: [neutral_closed]
    looks: [ordinary]     # 병원 기록 사진은 미모를 고르지 않는다 (2026-09-17)
  selfie:
    background: [home, cafe, outdoor, car, bathroom, cafe_window, terrace_golden, park_green]   # 뒤 셋은 미모 전용(looks_gates)
    # ⚠ context 화이트리스트가 없으면 전량 허용이라 "시술 직후 After 전용" 맥락 4종
    #   (outing_top·clinic_headband·hair_flat_after·cotton_pad)이 **Before** 에 붙는다.
    #   2026-09-08 실측: 400 표본 중 35.8% — cotton_pad 는 시술 전 사진에 시술 흔적이다.
    #   After 는 after_immediate 가 따로 강제하므로 여기서 빼도 직후 컷은 그대로다.
    #   회귀: selftest.py ⑥. (배경×맥락·프레이밍×맥락 표는 별건 — 리뷰 문서 §2-4)
    # finger_on_cheek 제거(2026-09-10 성연서님) — 손을 화면에 들이는 유일한 맥락이라 손 등장의 뿌리였다
    context: [none, pajamas, home_tee, towel_headband, cap, necklace, hair_in_face, knit_cardigan, white_blouse, fitted_black_top]   # 뒤 셋은 미모 전용
    angle: [selfie_3q, selfie_side, chin_up, tilted, selfie_high, selfie_low, front]
    lighting: [window, fluorescent, night, backlit, ceiling_harsh, mixed, flash, window_soft, golden_hour]   # golden_hour = 미모 전용. 링라이트 제외 (스튜디오 느낌). flash·window_soft = 0914 조명 호
    color: [neutral, warm, cool, iphone, galaxy]                             # 뷰티필터 제외
    quality: [mid, old, front_cam, app_upload]                               # flagship 제외
    # ⚠ 이 줄은 화이트리스트다 — expression 축에 칸을 만들어도 여기 안 적으면 **한 번도 안 뽑힌다**
    #   (2026-09-11 실측: 새 칸 5개를 넣고 300 표본을 돌렸더니 분포가 종전 2종 그대로였다).
    expression: [neutral_closed, slight_smile, relaxed_open,
                 gaze_off, gaze_screen, brow_up, eyes_narrow, blink_soft,
                 jaw_loose, lips_speak, lip_asym]
  # 임상: 프레이밍·맥락은 고정

# 배경별 호환 조명 (셀카 모드). 배경을 먼저 뽑고 조명은 이 목록 안에서만 선택.
# ⚠ flash 는 어두운 실내에서만, window_soft 는 창이 있는 곳에서만 (2026-09-14).
#   욕실엔 window_soft 를 넣지 않았다 — 그래서 욕실 배경에서는 '후=부드러운 빛' 호가 성립하지 않고
#   조명이 그대로 남는다(종전 잠금과 같은 동작). 사실이 아닌 곳에 빛을 만들어 넣지 않으려는 것이다.
background_lighting:
  home: [window, fluorescent, night, ring, ceiling_harsh, mixed, flash, window_soft]
  cafe: [window, fluorescent, backlit, mixed, window_soft, golden_hour]
  outdoor: [window, backlit, golden_hour]
  cafe_window: [window, backlit, window_soft, golden_hour]
  terrace_golden: [golden_hour, backlit]
  park_green: [window, backlit, golden_hour]
  car: [window, backlit, night, mixed, flash, window_soft]
  bathroom: [fluorescent, ring, ceiling_harsh, flash]
  clinic_waiting: [fluorescent, window, mixed]
  clinic_mirror: [fluorescent, ceiling_harsh]
  clinic_bed: [fluorescent, ceiling_harsh, ring]
  car_after: [window, backlit, mixed]

# 배경 × 맥락 허용표 (셀카). 배경을 먼저 뽑고 맥락은 이 목록 안에서만.
# 실측(0908): 배경·맥락이 독립 추첨이라 "차 안 + 수건 헤어밴드" 같은 조합이 나왔다.
context_allow:
  home:           [none, pajamas, home_tee, towel_headband, cap, necklace, hair_in_face]
  bathroom:       [none, pajamas, home_tee, towel_headband, hair_in_face]
  cafe:           [none, cap, necklace, hair_in_face, outing_top, knit_cardigan, white_blouse, fitted_black_top]
  outdoor:        [none, cap, necklace, hair_in_face, outing_top, knit_cardigan, white_blouse, fitted_black_top]
  car:            [none, cap, necklace, hair_in_face, outing_top, knit_cardigan, white_blouse, fitted_black_top]
  cafe_window:    [none, necklace, hair_in_face, knit_cardigan, white_blouse, fitted_black_top]
  terrace_golden: [none, necklace, hair_in_face, knit_cardigan, white_blouse, fitted_black_top]
  park_green:     [none, cap, necklace, hair_in_face, knit_cardigan, white_blouse, fitted_black_top]
  clinic_waiting: [none, outing_top, clinic_headband, hair_flat_after]
  clinic_mirror:  [none, outing_top, clinic_headband, hair_flat_after]
  clinic_bed:     [none, clinic_headband, hair_flat_after]
  car_after:      [none, outing_top, hair_flat_after]

# 프레이밍 × 맥락 금지표 (그 부위가 화면에 없으면 그 소품도 없다). 실측(0908): forehead_cut + cap = 없는 이마에 챙 그림자
framing_ban:
  forehead_cut: [cap]
  lower_face:   [cap, towel_headband, clinic_headband]
  one_cheek:    [cap, towel_headband, clinic_headband, necklace, knit_cardigan, white_blouse, fitted_black_top]   # 옷깃이 안 보이는 컷
  nose_to_neck: [cap, towel_headband, clinic_headband]
  neck_only:    [cap, towel_headband, clinic_headband, hair_in_face, finger_on_cheek, hair_flat_after]

# 셀카 모드 After 드리프트: Before 대비 달라져도 되는 축과 확률. 이목구비는 항상 고정.
# 경과 시점(timeline)별로 다르다:
#   immediate = 시술 당일 → 같은 옷·같은 머리·같은 장소 (몇 시간 뒤). 각도·프레이밍만 조금 다름
#   1w/2w/4w  = 다른 날   → 옷·머리·배경·조명 전부 달라야 "다른 날 찍은 사진"으로 읽힘
after_drift:
  selfie:
    immediate:             # 배경·맥락은 아래 after_immediate 로 강제 교체되므로 확률 1.0
      background: 1.0
      lighting: 1.0
      angle: 0.8
      framing: 0.6
      color: 0.3
      quality: 0.3
      hair_style: 0.3
      hair_color: 0.0
      extras: 0.3
      context: 1.0
      expression: 0.5
    later:                 # 1w, 2w, 4w 공통
      background: 0.9
      lighting: 0.8
      angle: 0.7
      framing: 0.6
      color: 0.5
      quality: 0.4
      hair_style: 0.7
      hair_color: 0.15
      extras: 0.6
      context: 0.9
      expression: 0.7
  clinical: {}

# 시술 직후 After 는 "집에서 찍은 Before" 와 다른 장소·옷이어야 자연스럽다:
# 병원 대기실·거울·시술 베드·병원 나온 직후 차 안, 외출복 또는 시술용 헤어밴드.
after_immediate:
  selfie:
    background: [clinic_waiting, clinic_mirror, clinic_bed, car_after]
    context: [outing_top, clinic_headband, hair_flat_after]   # cotton_pad 제외(0910 성연서님 "어색한 마취크림")
    extras: [none, glasses, glasses_thick, mask_chin, tired]   # 같은 날 생길 수 있는 것만 (0909 dry-run: 직후 컷에 수염이 생겼다)

# 축 가중치 (균형 샘플링 시 옵션별 등장 비율). 미지정 옵션은 1.
# 실제 고객층 반영: 한국 여성 비중 확대.
weights:
  country: {korea: 5, japan: 1, china: 1, sea: 1, west: 1}       # 한국 ≈ 55%
  gender: {female: 3, male: 1}                                   # 여성 75%
  looks: {attractive: 6, ordinary: 4}                            # 미모 6 : 보통 4 (09-16 회의, 셀카만 — 임상은 mode_rules 가 ordinary 고정)
  age: {late_teens: 1, early_20s: 2, late_20s: 3, "30s": 3, "40s": 3, "50s": 2, "60s": 1}
  # 셀카: 정면은 드물게, 부분 크롭 우세 (레퍼런스 후기 사진 비율 반영)
  # 임상 각도 three_quarter·side 는 임상 전용 값이라 셀카에 영향 없다. 레퍼런스 3장 전부 정면 → 정면 ≈ 50% (2026-09-15)
  angle: {front: 1, selfie_high: 1, selfie_low: 1, selfie_3q: 3, selfie_side: 2, chin_up: 2, tilted: 2, three_quarter: 0.5, side: 0.5}
  # 프레이밍 (2026-09-11 성연서님 B안 "눈 안 보이는 컷은 계속 쓰되 비중을 줄인다", 목표 못 잼 10% 미만).
  # 가중은 취향이 아니라 **프레이밍별 실측 못 잼률**에서 나왔다 —
  #   한쪽 볼 7/7(100%) · 목만 3/4(75%) · 아래 얼굴 4/8(50%) · 코~목 1/8(12.5%) · 이마 잘림 0/11 · 얼굴 전체 0/8.
  # 눈이 프레임 밖이면 얼굴 검출기가 시작을 못 한다(그림이 나빠서가 아니다) → 그 컷이 많을수록 게이트가 조용히 꺼진다.
  # ⚠ 빼지 않고 낮추기만 한다. 리얼리티(초근접 후기 사진 느낌)를 버리지 않으려는 것이고,
  #   0 으로 죽이면 모델이 나중에 좋아졌는지 확인할 길이 사라진다.
  # ⚠ forehead_cut 을 제일 높였다 — '아주 가까운 셀카'인데 눈이 프레임 안이라, 리얼리티와 검사 가능성을 동시에 만족하는 유일한 칸이다.
  # ⚠ 최소 1 rep 이라 실효 하한은 0.25 다(planner.WEIGHT_SCALE=4). 더 줄이려면 framing_allow 에서 빼라.
  # 재계산·검증 = tools/framing_na_forecast.py (실측률을 원장에서 다시 읽어 예상 못 잼을 낸다)
  framing: {head_to_bust: 2, full_face: 3, forehead_cut: 6, lower_face: 0.5, one_cheek: 0.25, nose_to_neck: 1.5, neck_only: 0.25}
  # 상담용 사진은 대부분 무표정이다 — 무표정을 줄이는 게 아니라 **무표정의 결을 늘린다**(2026-09-11).
  # 합이 무표정 계열 : 미소 1 이라 "상담 사진 같음"은 그대로고, 같은 얼굴이 반복되는 느낌만 흩어진다.
  # ⚠ 이 표는 '표정 이름'이 아니라 **입 상태**로 읽어라 (2026-09-11 오후) — 이름을 8종으로 늘려도
  #   입이 2종이면 사람 눈엔 똑같다. 지금 입 상태 비중은 다문(힘) 9 : 다문(이완) 3 : 살짝 벌림 4 : 벌림 1.5.
  #   `neutral_closed` 를 3으로 크게 둔 채 새 칸을 넣으면 최빈 입 상태가 안 내려가서 2.5 로 낮췄다.
  expression: {neutral_closed: 2.5, slight_smile: 1, relaxed_open: 2,
               gaze_off: 2, gaze_screen: 2, brow_up: 1.5, eyes_narrow: 1.5, blink_soft: 1,
               jaw_loose: 1.5, lips_speak: 1.5, lip_asym: 1.5}

output:
  aspect: "4:5"

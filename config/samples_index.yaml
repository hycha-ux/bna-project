# 참조 이미지 라이브러리 색인. samples/reference/{clinical,selfie}/ 에 파일을 넣고 여기에 태그.
# 생성 시 태그가 맞는 참조를 1~2장 style_refs 로 함께 입력한다. 고르는 코드 = src/bna/refs.py 하나.
#
# 칸 (2026-09-11 시술·시점 축 신설 — 그 전엔 mode 와 조명·화질·배경만 봤다):
#   file       : samples/reference/ 아래 상대경로. **파일이 없으면 소리 내고 죽는다**(색인에만 있는 유령 금지)
#   mode       : selfie | clinical  (필수)
#   treatment  : 이 시술 컷에만 쓴다. 목록 가능. **안 적으면 범용** — 모든 시술에 붙는다
#   timeline   : 이 시점 After 에만 쓴다 (immediate | 1w | 2w | 4w). 목록 가능. 안 적으면 범용
#                `before` 면 **시술 전 컷 전용** — 결함(푸석·큰 모공·홍조)이 찍힌 사진은 After 에 붙이면 안 된다 (2026-09-14)
#   tags       : {lighting, quality, background} — 맞을수록 우선. 거르지는 않는다(점수축)
#   note       : 출처·이용 가능 여부 (사람이 읽는 칸)
#
# ⚠ **시점 태그가 붙은 참조는 시술 전(Before) 컷에 절대 안 들어간다.** 직후 사진엔 패치·홍조가
#   찍혀 있어서, Before 에 붙으면 아직 시술도 안 한 얼굴에 그 흔적이 그려진다 — 오류 없이 전량 불량.
# ⚠ 참조 1장은 공짜가 아니다: 그 호출의 입력 이미지 토큰이 붙는다(실측 1024x1280 기준 1,280토큰
#   ≈ $0.010/호출). 세트 하나(Before 1 + After 2)면 3콜이라 ≈$0.031. 근거=outputs/usage.jsonl.
# ⚠ 얼굴이 나오는 참조는 동의·이용 범위를 note 에 적고, 원본은 이 리포 밖에 둔다.
#
# ⚠ **태그는 사진의 사실이지 바람이 아니다** (2026-09-14 티모가 10장을 직접 열어 교정).
#   처음 태그엔 셀카에 **존재하지 않는 값**이 있었다 — `quality: flagship`(셀카는 mid/old/front_cam/app_upload)
#   과 `background: clinic`(셀카 배경은 home/bathroom/cafe/car). 없는 값은 영원히 0점이라,
#   `skin_pores_*_03` 쌍이 120회 중 7회(6%)만 붙었다. 점수를 못 받는 태그는 '틀린 태그'다.
#   그리고 **배경 태그는 뺐다** — 열 장 전부 배경이 안 보이는 볼 확대 컷이라 적을 사실이 없다.
#   ⚠ After 참조에 `flash` 가 있는 건 오타가 아니다(03 쌍은 전·후 둘 다 플래시 확대다).
#     지금 설정의 After 조명은 부드러운 빛이라 그 태그는 0점이지만, 사실대로 두는 쪽이 맞다 —
#     동점을 번갈아 쓰는 건 refs._rank 가 맡는다.
#
# 2026-09-11: 빌디가 `refs_pending` 에 대기시켜 둔 팔자 직후 실사를 **정식 색인으로 올렸다** —
#   대기 사유였던 "pick 이 시술·시점을 안 거른다"가 같은 날 해소됐다(refs.py 의 treatment·timeline 축).
#   ⚠ 이 사진은 회색 배경의 병원 촬영본인데 셀카 모드 참조로 들어간다. style_refs 는 *그림체*도 옮기므로
#     첫 8장 회차에서 **배경이 회색 임상 배경으로 끌려가는지** 확인하라 — 끌려가면 mode 를 clinical 로
#     옮기거나 배경만 잘라 쓰는 게 답이다(지금은 근거 0이라 빌디 태그 그대로 둔다).
refs:
- file: selfie/nasolabial_immediate_01.jpg
  mode: selfie
  treatment: nasolabial
  timeline: immediate
  tags: {lighting: fluorescent, quality: flagship, background: clinic_waiting}
  note: >
    온리프 병원 촬영 팔자 필러 직후 실사 (2026-09-11 성연서님 제공, 눈 모자이크). 투명 하이드로콜로이드 패치가
    입꼬리 바깥쪽 볼(팔자 아래 끝)과 입가 주름(턱선 쪽)에 하나씩, 볼 넓게 홍조 + 주사 자국 점점이.
    After(직후) 컷 전용 — Before 나 다른 시점에 쓰면 안 된다.

# ── 미모 셀카 장면 참조 (2026-09-17 성연서님 "노션 AI 셀카 사용해도 되는 사진, 1·2 순서 진행") ──
#   원천 = 성연서님 노션 '온볼라썸 BA 모음' > AI 토글 셀카 30세트(사용 허락받음). **얼굴·손·팔을 잘라낸 배경 띠만** 쓴다 —
#   세트끼리 얼굴이 닮아(0.5↑ 40/820쌍) 얼굴째 참고하면 결과가 한 얼굴로 모인다. 만드는 법 = teemo 리포 tools/notion-bg-crops.py.
#   `looks: attractive` = 미모 세트에만(refs.candidates 가 거른다). `timeline: before` = 전 컷에만 — 직후 컷은 병원 배경이라 충돌.
#   `only_background` = 그 배경이 뽑힌 컷에만(필터). 욕실 컷에 카페 창가 사진이 붙으면 장면이 부딪힌다.
#   ⚠ 팔자 한정으로 시작한다(2세트 비교 전). 다른 시술로 넓히려면 treatment 줄만 지워라 — 피부 3종은 전용 참조가 +2 라 섞여 붙는다.

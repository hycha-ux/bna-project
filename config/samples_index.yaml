  treatment: nasolabial
  timeline: immediate
  tags: {lighting: fluorescent, quality: flagship, background: clinic_waiting}
  note: >
    온리프 병원 촬영 팔자 필러 직후 실사 (2026-09-11 성연서님 제공, 눈 모자이크). 투명 하이드로콜로이드 패치가
